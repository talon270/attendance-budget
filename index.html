<body>
<a class="skip" href="#main">Skip to the numbers</a>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Attendance</b><small id="brand-sub">no timetable loaded</small></div>
    <div class="swatches"><div class="sw-set" id="palbar" role="radiogroup" aria-label="Colour theme"></div>
      <small class="sw-name" id="palname"></small></div>
  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap"><div class="tabtrack" id="tabbar" role="tablist"></div></div></nav>
<main id="main"><div class="wrap"><div id="banners" role="status" aria-live="polite"></div><div id="view"></div></div></main>
<div class="pop" id="pop" role="dialog" aria-label="Mark this class" hidden></div>
<div class="undobar" id="undobar" role="status" aria-live="polite" hidden></div>
<footer class="bot"><div class="wrap" id="foot"></div></footer>
<script>
/* ==========================================================================
   ATTENDANCE BUDGET · CORE
   --------------------------------------------------------------------------
   · CALENDAR — the hardcoded semester, authored through the Calendar tab
   · Storage  — one key, atten.v1, integer SCHEMA_VERSION, migrate on read
   · Import   — a bob-attendance payload, applied as a diff, never a replace
   · Sessions — CALENDAR x meetings, expanded into dated, hour-priced sessions
   · Numbers  — held / attended / budget, every rounding against the student
   · Marks    — set explicitly, never cycled; a 20-deep undo stack
   · Check-in — reviewedThrough: what has been checked, and what is on trust
   · Planner  — whole days off priced through stats() as a what-if
   · Views    — Overview, Log, Leave, Week, Settings
   Public namespace: window.Atten
   ========================================================================== */
(function(){
"use strict";

// --- Constants -------------------------------------------------------------

const SCHEMA_VERSION = 6;   // 2 adds countFrom; 3 made theme a palette id; 4 and 5 retire some of them; 6 adds reviewedThrough and leavePlan
const STORE_KEY   = 'atten.v1';        // the whole profile, one key
const UNDO_KEY     = 'atten.undo';     // pre-import snapshot, one deep
const ARCHIVE_PRE  = 'atten.archive.'; // a displaced semester, never mixed in
const RESCUE_PRE   = STORE_KEY + '.unreadable-'; // a profile that would not parse, kept verbatim
const UNDO_DEPTH   = 20;               // marks you can step back through; memory only, gone on reload

// 75% is Ashoka's usual bar. It is per-course editable because a course can
// set its own, and the app must never argue with a syllabus.
const DEFAULT_THRESHOLD = 0.75;

// Two dark, two light. Ported from the Study Tracker, which carries twenty-six;
// these are the four whose accent stays clear of the green/amber/red that mean
// safe, close and under the bar here. Order is the order they appear in the
// header, darkest first.
const PALETTES = [
  ['selene',    'Selene',    'dark'],
  ['wraith',    'Wraith',    'dark'],
  ['porcelain', 'Porcelain', 'light'],
  ['ink',       'Ink',       'light']
];
const PALETTE_IDS = PALETTES.map(p => p[0]);
const DEFAULT_PALETTE = 'selene';
// Every id this app has ever stored, pointing at what replaced it. A palette
// that is retired must not silently reset someone to the default.
const PALETTE_WAS = { dark:'selene', monolith:'selene', mariana:'wraith', cryotube:'wraith', light:'porcelain' };

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];   // Sunday never teaches
const PX_PER_MIN = 1.25;              // Bob's scale, so the grids look alike
const DEFAULT_GRID_START = 480, DEFAULT_GRID_END = 1200;

// Authored 2026-09-03 from Shiv Nadar University's published "Academic Calendar
// for Monsoon 2026 (Aug to Dec 2026)", kept beside this file as
// academic_calendar_monsoon_2026.pdf. Mon-Sat teach by default; every date
// below is an exception.
//
// Only that PDF's RED days are off. Its ORANGE days are restricted holidays and
// classes run on them: Raksha Bandhan, Milad-un-nabi, Janmashtami, Vinayaka
// Chaturthi, Maha Ashtami, Karaka Chaturthi and Bhai Duj are all teaching days.
// The PDF's own per-weekday teaching counts prove it, and this file reproduces
// all thirty of those counts exactly - see the harness.
//
// halfBoundary is 1 October, not the 12 October the PDF labels "2nd half
// begins", and that is deliberate. The PDF also publishes 39 first-half and 40
// second-half teaching days, and the only split reproducing both puts the
// 1 October buffer day in the second half. First Half Finishes 30 September,
// exactly as the PDF's own label on that date says.
const CALENDAR = {
  semester: 'monsoon2026', label: 'Monsoon 2026',
  authored: '2026-09-03', provisional: false,
  source: 'Shiv Nadar University, Academic Calendar for Monsoon 2026',
  start: '2026-08-17',   // Start of classes for all students
  end:   '2026-12-01',   // Last Teaching Day, run as a Friday
  halfBoundary: '2026-10-01',
  off: [
    '2026-10-02',                                        // Gandhi Jayanti
    '2026-10-03', '2026-10-05', '2026-10-06',            // Mid Term Examinations
    '2026-10-07', '2026-10-08', '2026-10-09',
    '2026-10-10',                                        // No class day
    '2026-10-20',                                        // Dussehra / Maha Navami
    '2026-10-30', '2026-10-31',                          // Surge / No class day
    '2026-11-09',                                        // Govardhan Puja
    '2026-11-24'                                         // Guru Nanak's Birthday
  ],
  // The last two teaching days run another day's timetable. A Monday-only
  // course therefore meets neither of them, and a Friday-only course gets one
  // last meeting on 1 December.
  swaps: { '2026-11-30': 'Tue', '2026-12-01': 'Fri' }
};

// --- Small helpers ---------------------------------------------------------

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Date keys are local-time YYYY-MM-DD. Never UTC: a boundary that disagrees
// with the student's clock puts a class on the wrong day.
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromYmd(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today(){ return ymd(new Date()); }
function addDays(s, n){ const d = fromYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function dowName(s){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][fromYmd(s).getDay()]; }
function prettyDate(s){ const d = fromYmd(s); return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}); }
function hhmm(min){ const h = Math.floor(min/60), m = min%60, ap = h<12?'am':'pm', h12 = (h%12)||12;
  return h12 + (m? ':'+String(m).padStart(2,'0') : '') + ap; }

// Contact hours round to the nearest half hour. Verified against all 1068
// meetings in new_timetable.json: nine distinct durations, every one mapped
// unambiguously. Nearest rather than ceiling because it stays sane on a
// duration the catalog does not yet contain - 65 minutes is 1.0h, not 1.5h.
function contactHours(start, end){ return Math.round((end-start)/60*2)/2; }
const h1 = n => (Math.round(n*10)/10).toFixed(1);
// Leave is floored and a shortfall is ceilinged, both to one decimal. 9.75h of
// budget prints as 9.7h, never 9.8h: a tenth of an hour the student does not
// have is exactly the lie this app exists to not tell.
const hDown = n => (Math.floor(n*10 + 1e-9)/10).toFixed(1);
const hUp   = n => (Math.ceil(n*10 - 1e-9)/10).toFixed(1);

// Percentages floor rather than round: 74.96% must never print as 75%.
const pctText = f => (Math.floor(f*1000)/10).toFixed(1) + '%';

// --- Storage ---------------------------------------------------------------

function blank(){
  return { v: SCHEMA_VERSION, semester: null, planName: '', exportedAt: null, importedAt: null,
           courses: [], log: {}, extras: [], thresholds: {}, official: {}, theme: null, week: null,
           // null means "the whole term". A date here is the day you started
           // keeping records, and nothing before it counts toward anything.
           countFrom: null,
           // The last day whose held classes you have checked. null means none
           // ever were: every past class is counted as attended on trust, and
           // the page says so until you answer the start-up question.
           reviewedThrough: null,
           // Whole days off you are considering. A what-if only - nothing here
           // touches a figure until you commit it as missed classes.
           leavePlan: [] };
}
function migrate(o){
  if(!o || typeof o !== 'object') return blank();
  const b = blank();
  // Unknown-future guard: a profile written by a newer build is left alone and
  // reported, never silently downgraded by filling in fields it may not mean.
  if(typeof o.v === 'number' && o.v > SCHEMA_VERSION) o.__future = true;
  Object.keys(b).forEach(k => { if(o[k] === undefined) o[k] = b[k]; });
  // v3 made theme a palette id; v4 retired monolith and mariana for selene and
  // cryotube; v5 retired cryotube for wraith. PALETTE_WAS maps every id this
  // app has ever written straight onto what currently
  // replaced it, so the setting survives a retirement rather than resetting a
  // returning visitor. Anything still unrecognised becomes null, which means
  // "follow the system" - the same as never having chosen.
  if(o.theme != null && PALETTE_IDS.indexOf(o.theme) < 0) o.theme = PALETTE_WAS[o.theme] || null;
  o.v = SCHEMA_VERSION;
  return o;
}
let S = blank();
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); S = migrate(JSON.parse(raw)); }
  catch(e){
    // Copied aside before anything can save. The banner used to promise the
    // unreadable copy was "not overwritten" while the next palette click did
    // exactly that, and no other copy existed anywhere.
    S = blank(); S.__corrupt = true; S.__rescued = null;
    try{ const k = RESCUE_PRE + Date.now(); localStorage.setItem(k, raw); S.__rescued = k; }catch(e2){}
  }
  // A planned day that has passed is dropped, never turned into an absence.
  const t = today(), was = S.leavePlan.length;
  S.leavePlan = S.leavePlan.filter(d => d >= t);
  S.__planDropped = was - S.leavePlan.length;
}
// Keys starting __ describe this session (a corrupt read, a dropped plan) and
// are never written: saved, __corrupt would raise its banner forever.
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S, (k,v) => k.slice(0,2) === '__' ? undefined : v)); }
  catch(e){ toast('Could not save - storage is full or blocked.','err'); } }

// --- Sessions --------------------------------------------------------------
//
// One pass over the semester, in the order the plan fixes: walk the dates,
// drop the off days and Sundays, resolve a swap to the weekday it runs, then
// emit one session per meeting on that weekday whose half of term contains it.
// Session id is code|comp|sec|date|start - stable across re-imports, which is
// what lets an import be a diff instead of a replace.

let _sessions = null;
function invalidate(){ _sessions = null; }

// The day record-keeping starts. Sessions before it are generated - the grid
// still draws them, and saying so is the point - but they feed nothing: not
// what was held, not what you attended, not the semester total, not the budget.
//
// Excluding them can only shrink a budget, never inflate one. Dropping an
// hour that defaults to attended costs the budget h - threshold*h, which is
// positive, so the number moves against you. That is the right direction for
// a figure you are guessing at: before this date the app has no records, and
// counting a class you cannot vouch for as attended is exactly the lie this
// app exists to not tell.
//
// The official record still counts those weeks. That disagreement is real and
// permanent, which is why setting this raises a banner that does not go away.
function countFrom(){
  const d = S.countFrom;
  return (d && d > CALENDAR.start) ? d : CALENDAR.start;
}

function sessions(){
  if(_sessions) return _sessions;
  const out = [];
  const cf = countFrom();
  const off = new Set(CALENDAR.off || []);
  const swaps = CALENDAR.swaps || {};
  const hb = CALENDAR.halfBoundary;
  for(let d = CALENDAR.start; d <= CALENDAR.end; d = addDays(d,1)){
    if(off.has(d)) continue;
    const real = dowName(d);
    if(real === 'Sun' && !swaps[d]) continue;
    const day = swaps[d] || real;
    if(day === 'Sun') continue;
    S.courses.forEach(c => (c.meetings||[]).forEach(m => {
      if(m.day !== day) return;
      if(m.term === 'First half'  && hb && d >= hb) return;
      if(m.term === 'Second half' && hb && d <  hb) return;
      out.push({ id: c.code+'|'+m.comp+'|'+m.sec+'|'+d+'|'+m.start,
                 code: c.code, comp: m.comp, sec: m.sec, date: d,
                 start: m.start, end: m.end, room: m.room, hours: contactHours(m.start, m.end),
                 swapped: !!swaps[d], extra: false, counted: d >= cf });
    }));
  }
  (S.extras||[]).forEach(x => out.push({
    id: x.code+'|EXTRA|X|'+x.date+'|'+x.start, code: x.code, comp: 'EXTRA', sec: 'X',
    date: x.date, start: x.start, end: x.end, room: x.note||'', hours: contactHours(x.start, x.end),
    swapped: false, extra: true, counted: x.date >= cf
  }));
  out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.start - b.start);
  _sessions = out;
  return out;
}

// The next class that has not finished yet - the one the hero is about. The
// session list is already in date/time order, so the first match is it.
function nextSession(){
  const now = new Date(), todayK = ymd(now), mins = now.getHours()*60 + now.getMinutes();
  return sessions().find(s => s.counted && markOf(s) !== 'cancelled'
      && (s.date > todayK || (s.date === todayK && s.end > mins))) || null;
}
function whenLabel(s){
  const now = new Date(), todayK = ymd(now), mins = now.getHours()*60 + now.getMinutes();
  if(s.date === todayK){
    if(s.start <= mins) return 'on now, until ' + hhmm(s.end);
    const d = s.start - mins;
    if(d < 60) return 'in ' + d + ' minute' + (d===1?'':'s');
    const h = Math.floor(d/60), m = d%60;
    return 'in ' + h + 'h' + (m ? ' ' + m + 'm' : '');
  }
  if(s.date === addDays(todayK,1)) return 'tomorrow at ' + hhmm(s.start);
  return prettyDate(s.date) + ' at ' + hhmm(s.start);
}

const markOf = s => S.log[s.id] || 'attended';
// What a mark is called on screen. Storage keeps 'absent'; people say missed.
const MARK_WORD = { attended:'attended', absent:'missed', cancelled:'cancelled' };

// Every mark is set, never cycled. A click used to step attended -> absent ->
// cancelled, so a second tap on an absence cancelled the class: the absence
// vanished, the class left the denominator, and ECO373's leave grew 12.375h ->
// 13.125h. Pressing the state a class is already in now does nothing.
//
// Each change goes on an undo stack with the fields it moved, so one button
// can step back through marks, a check-in, a committed plan or the start-up
// answer alike. Memory only: it does not survive a reload, and nothing on the
// page says it does.
const UNDO = [];
function remember(label, logBefore, fields){
  UNDO.push({ label, log: logBefore, fields: fields || null });
  if(UNDO.length > UNDO_DEPTH) UNDO.shift();
  undoBar(label);
}
// Writes marks without saving or remembering; returns {id: previous} for those that moved.
function writeMarks(ids, mark){
  const before = {};
  ids.forEach(id => {
    const cur = S.log[id] || 'attended';
    if(cur === mark) return;
    before[id] = cur;
    if(mark === 'attended') delete S.log[id]; else S.log[id] = mark;
  });
  return before;
}
function setMark(id, mark, label){
  const before = writeMarks([id], mark);
  if(!Object.keys(before).length) return false;
  save(); remember(label || 'Marked ' + MARK_WORD[mark], before);
  return true;
}
function undo(){
  const u = UNDO.pop(); if(!u) return;
  Object.keys(u.log).forEach(id => { const m = u.log[id]; if(m === 'attended') delete S.log[id]; else S.log[id] = m; });
  if(u.fields) Object.assign(S, u.fields);
  save(); render();
  undoBar(null, 'Undone: ' + u.label.charAt(0).toLowerCase() + u.label.slice(1) + '.');
}
// One bar at the foot of the screen, outside #view so a re-render never eats it.
let undoTimer = null;
function undoBar(label, done){
  const el = $('#undobar'); if(!el) return;
  clearTimeout(undoTimer);
  if(label == null && UNDO.length) label = UNDO[UNDO.length-1].label;
  el.innerHTML = done ? '<span>' + esc(done) + '</span>' + (UNDO.length ? '<button class="btn small" id="undo-mark">Undo again</button>' : '')
                      : '<span>' + esc(label) + '.</span><button class="btn small" id="undo-mark">Undo</button>';
  el.hidden = false;
  undoTimer = setTimeout(() => { el.hidden = true; }, 9000);
}
function sessionName(s){ return s.code + ' ' + prettyDate(s.date) + ' ' + hhmm(s.start); }
const thresholdOf = code => (S.thresholds && S.thresholds[code] != null) ? S.thresholds[code] : DEFAULT_THRESHOLD;

// --- The numbers -----------------------------------------------------------
//
// held    = non-cancelled sessions dated before today
// attended= held minus the hours marked absent
// total   = every non-cancelled session, past and future
// budget  = attended + future - threshold x total, floored at zero
//
// The session-equivalent of the budget is floored against the largest session
// still to come. 9.75h of budget on 1.0h classes is nine classes, not ten:
// missing ten leaves 29.0h of 39.0h, which is 74.4% and a fail.

// `hypo`, when given, is a Set of session ids to price as missed - the leave
// planner's what-if. It never touches S.log, and a cancelled class stays
// cancelled whatever the plan says.
function stats(code, hypo){
  const thr = thresholdOf(code);
  let held = 0, absent = 0, total = 0, future = 0, maxH = 0, nHeld = 0, nAbsent = 0;
  const todayK = today();
  sessions().forEach(s => {
    if(s.code !== code) return;
    if(!s.counted) return;
    let mark = markOf(s);
    if(mark === 'cancelled') return;
    if(hypo && hypo.has(s.id)) mark = 'absent';
    total += s.hours;
    if(s.date < todayK){ held += s.hours; nHeld++; if(mark === 'absent'){ absent += s.hours; nAbsent++; } }
    // A future class you have already decided to miss is not slack you still
    // hold. It stays in the semester total - it is still scheduled - but it
    // stops counting toward what you will have attended, so the budget drops
    // the moment you mark it rather than on the day it passes.
    else { if(mark !== 'absent') future += s.hours; if(s.hours > maxH) maxH = s.hours; }
  });
  const attended = held - absent;
  const budget = attended + future - thr*total;
  const step = maxH || 1;
  const st = { code, thr, held, absent, attended, total, future, nHeld, nAbsent, budget,
               pct: nHeld ? attended/held : null,
               budgetHours: Math.max(0, budget),
               budgetSessions: Math.max(0, Math.floor(Math.max(0,budget)/step)),
               step, reachable: budget >= 0 || (attended + future) >= thr*total };
  st.shortHours = st.pct == null ? 0 : Math.max(0, thr*held - attended);
  st.state = !nHeld ? 'none' : st.pct < thr ? 'over' : (st.budgetHours < step ? 'close' : 'safe');
  return st;
}

function stateLine(st){
  // No percentage exists before the first class, but the budget does - it is
  // arithmetic on the calendar alone. Showing the total and staying silent on
  // the leave would withhold the one number the student came for.
  if(st.state === 'none') return 'No classes held yet - ' + h1(st.total) + 'h scheduled. That leaves '
    + hDown(st.budgetHours) + 'h of leave (' + st.budgetSessions + ' ' + (st.budgetSessions===1?'class':'classes')
    + ' of ' + h1(st.step) + 'h) at a ' + Math.round(st.thr*100) + '% bar.';
  if(st.state === 'over'){
    let l = 'You are ' + hUp(st.shortHours) + 'h short of ' + Math.round(st.thr*100) + '%. ' + h1(st.future) + 'h of classes remain.';
    if(!st.reachable) l += ' Attending every one of them still leaves you under the bar - this course cannot be recovered by attendance alone.';
    return l;
  }
  if(st.state === 'close') return 'Less than one class of leave left (' + hDown(st.budgetHours) + 'h). One more absence puts you under ' + Math.round(st.thr*100) + '%.';
  return st.budgetSessions + ' ' + (st.budgetSessions===1?'class':'classes') + ' of leave left, counting each as ' + h1(st.step) + 'h, the longest still to come (' + hDown(st.budgetHours) + 'h in all).';
}

// --- Palette ---------------------------------------------------------------

function activePalette(){
  if(S.theme && PALETTE_IDS.indexOf(S.theme) >= 0) return S.theme;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'porcelain' : DEFAULT_PALETTE;
}
function applyPalette(id){
  document.documentElement.setAttribute('data-palette', id);
  // The address bar and the installed app's title bar are painted by the OS
  // from this, so a palette that changed only the page would leave a strip of
  // the old one framing it.
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}
function paintPicker(){
  const cur = activePalette();
  $('#palbar').innerHTML = PALETTES.map(p =>
    '<button class="sw" data-pal="' + p[0] + '" role="radio" aria-checked="' + (p[0] === cur) + '"'
    + ' tabindex="' + (p[0] === cur ? '0' : '-1') + '" title="' + p[1] + ' - ' + p[2] + '"'
    + ' aria-label="' + p[1] + ', ' + p[2] + '"></button>').join('');
  $('#palname').textContent = (PALETTES.find(p => p[0] === cur) || [])[1] || '';
}

// --- Chrome: banners, toasts, tabs ----------------------------------------

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'msg ' + (kind==='err'?'err':'ok');
  el.setAttribute('role','status');
  el.textContent = msg;
  $('#banners').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function banners(){
  const out = [];
  if(S.__corrupt) out.push(['bad','Your saved profile could not be read',
    S.__rescued ? 'A verbatim copy was set aside as ' + S.__rescued + ' before anything else ran, and you can download it from Settings. Restore a backup there before logging anything.'
                : 'This browser would not let a copy be set aside, so the unreadable profile will be replaced the next time anything saves. Restore a backup from Settings before you click anything else.']);
  if(S.__planDropped) out.push(['warn', S.__planDropped + ' planned day' + (S.__planDropped===1?' has':'s have') + ' passed',
    'They were dropped from your leave plan. Nothing was marked missed - if you did take them, log them on the Log tab.']);
  if(S.__future) out.push(['bad','This profile was written by a newer version of the app','Some of what it holds may not be shown. Update the app rather than logging on top of it.']);
  if(CALENDAR.provisional) out.push(['warn','The semester calendar is provisional','Its dates were not taken from Ashoka\'s published academic calendar - nothing on this machine holds one. Term start '+prettyDate(CALENDAR.start)+', end '+prettyDate(CALENDAR.end)+', half-semester boundary '+prettyDate(CALENDAR.halfBoundary)+', 0 holidays. Until you author the real one in the Calendar tab, every budget below is arithmetic on dates that are a guess.']);
  if(today() > CALENDAR.end) out.push(['warn','The calendar has run out','It was authored on '+CALENDAR.authored+' for '+CALENDAR.label+', which ended '+prettyDate(CALENDAR.end)+'. No sessions exist past that date, so every budget is frozen at the term end.']);
  if(S.countFrom && S.countFrom > CALENDAR.start){
    const x = excluded();
    out.push(['warn','You are counting from ' + prettyDate(S.countFrom) + ', not from the start of term',
      x.n + ' session' + (x.n===1?'':'s') + ' worth ' + h1(x.hours) + 'h, between ' + prettyDate(CALENDAR.start)
      + ' and the day before, are excluded from every figure on this page. Your official record still counts them, '
      + 'so the percentage here will read higher than the registrar\'s. Use Log › Reconcile before you trust either one.'
      + (x.logged ? ' ' + x.logged + ' of them have something logged against them, kept but not counted.' : '')]);
  }
  if(S.semester && S.semester !== CALENDAR.semester) out.push(['bad','Your timetable is from a different semester','It says '+esc(S.semester)+'; this build\'s calendar is '+CALENDAR.semester+'. Nothing has been mixed - import a current plan from the Data tab, and the old profile is archived first.']);
  $('#banners').innerHTML = out.map(b => '<div class="banner '+b[0]+'"><b>'+esc(b[1])+'</b>'+esc(b[2])+'</div>').join('');
}

// Overview answers "can I skip the next one", Log corrects the past, Leave
// plans the future, Week is the timetable. Settings holds the two things
// touched once a term - the data and the calendar constant.
const VIEWS = [['overview','Overview'],['log','Log'],['leave','Leave'],['week','Week'],['settings','Settings']];
const NEEDS_COURSES = {overview:1, log:1, leave:1, week:1};
let view = 'overview';
let lastView = null;      // entry animation runs on a view change, not on every render
let openCourse = null;    // the expanded course row, kept across a re-render
let refocus = null;       // #view is replaced wholesale, so keyboard focus is put back by hand

// Replacing #view removes a focused input, the input blurs, its change event
// fires, and that handler renders again - inside the first render's innerHTML
// assignment, which then throws. So a render asked for during a render is
// deferred until the first one has finished, and run once.
let rendering = false, renderAgain = false;
function render(){
  if(rendering){ renderAgain = true; return; }
  rendering = true;
  try{ renderNow(); } finally { rendering = false; }
  if(renderAgain){ renderAgain = false; render(); }
}
function renderNow(){
  invalidate();
  unmountFigures();
  closePop();
  banners();
  $('#tabbar').innerHTML = VIEWS.map(v =>
    '<button data-tab="'+v[0]+'"'+(v[0]===view?' aria-current="page"':'')+'>'+v[1]
    + (v[0]==='log' && S.courses.length && uncheckedCount() ? ' <span class="tabn">' + uncheckedCount() + '</span>' : '')
    + (v[0]==='leave' && S.leavePlan.length ? ' <span class="tabn">' + S.leavePlan.length + '</span>' : '')
    + '</button>').join('');
  const sub = S.courses.length
    ? S.courses.length + ' courses · ' + esc(S.planName || CALENDAR.label)
    : 'no timetable loaded';
  $('#brand-sub').textContent = sub;
  paintPicker();
  // The tab strip scrolls on a phone. Without this the active tab can sit
  // half off the left edge after visiting a tab further along, which reads as
  // a broken header rather than a scrolled one.
  const cur = $('#tabbar button[aria-current="page"]');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#view').innerHTML =
    (!S.courses.length && NEEDS_COURSES[view]) ? emptyView() :
    view === 'overview' ? overviewView() :
    view === 'log'      ? logView() :
    view === 'leave'    ? leaveView() :
    view === 'week'     ? weekView() : settingsView();
  // Only a view change flies the page in. Nudging a threshold re-renders too,
  // and replaying the stagger there reads as the page reloading under you.
  const el = $('#view');
  el.className = (lastView !== view) ? 'anim' : '';
  lastView = view;
  const bd = $('#bar-details');
  if(bd) bd.addEventListener('toggle', () => { barOpen = bd.open; });
  const cd = $('#cal-details');
  if(cd) cd.addEventListener('toggle', () => { calOpen = cd.open; });
  mountFigures();
  if(refocus){
    const back = el.querySelector('button.code[data-course="' + (window.CSS && CSS.escape ? CSS.escape(refocus) : refocus) + '"]');
    if(back) back.focus({preventScroll:true});
    refocus = null;
  }
  $('#foot').innerHTML = '<p>Everything is stored in this browser under <code>atten.v1</code>. No account, no server, no network. '
    + (S.importedAt ? 'Timetable imported ' + esc(S.importedAt.slice(0,10)) + '. ' : '')
    + 'Calendar authored ' + CALENDAR.authored + (CALENDAR.source ? ' from ' + CALENDAR.source + '.' : '.') + '</p>';
}

function emptyView(){
  return '<div class="empty">' + figureSlot('seats')
    + '<h2>No timetable yet</h2>'
    + '<p class="muted">This app never asks you to type your schedule. It reads the plan you already built.</p>'
    + '<ol class="steps"><li>Open <b>Bob the Builder</b>, pick the plan you are actually enrolled in.</li>'
    + '<li>Click <b>Export for attendance</b>. You get a <code>…-attendance-….json</code> file.</li>'
    + '<li>Come back to <b>Settings</b> here and load that file.</li></ol>'
    + '<p><button class="btn primary" data-go="settings">Go to Settings</button></p></div>'
    + portalCard();
}

// --- Shared pieces: when a class is over, marks, session rows -------------

function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
// Over means it has happened: an earlier day, or today and already ended.
// Stats still price today's classes as future until midnight - this is about
// what you can log and what you can still plan, not about the arithmetic.
function isOver(s){ const t = today(); return s.date < t || (s.date === t && s.end <= nowMin()); }

// Classes that have happened since the last check-in. Cancelled ones are
// listed too, so a wrong cancellation can be caught, but never counted below.
function uncheckedSessions(){
  const rt = S.reviewedThrough;
  return sessions().filter(s => s.counted && isOver(s) && (!rt || s.date > rt));
}
function uncheckedCount(){ return uncheckedSessions().filter(s => markOf(s) !== 'cancelled').length; }
function lastDay(){ return addDays(today(), -1); }

// Three explicit statements, one already true. For a class still to come they
// read as intentions - going, skipping - and no option is filled or loud: a
// call-to-action reading "skip" is an app nudging you to skip a class.
function markSeg(s, small){
  const m = markOf(s), ahead = !isOver(s);
  const opts = [['attended', ahead ? 'Going' : 'Attended', 'on-att'], ['absent', ahead ? 'Skipping' : 'Missed', 'on-abs'],
                ['cancelled', 'Cancelled', 'on-can']];
  return '<div class="seg' + (small ? ' sm' : '') + '" role="radiogroup" aria-label="' + esc(sessionName(s)) + '">'
    + opts.map(o => '<button class="' + o[2] + '" role="radio" data-mark="' + esc(s.id) + '" data-to="' + o[0] + '"'
      + ' aria-checked="' + (m === o[0]) + '" tabindex="' + (m === o[0] ? '0' : '-1') + '">' + o[1] + '</button>').join('')
    + '</div>';
}
function sessionRow(s, withDate){
  const m = markOf(s);
  const when = (withDate ? prettyDate(s.date) + ', ' : '') + hhmm(s.start);
  return '<li class="srow ' + m + '"><div class="sinfo"><b>' + esc(s.code) + '</b><span>' + esc(when) + ' &middot; '
    + esc(s.comp) + ' &middot; ' + h1(s.hours) + 'h' + (s.extra ? ' &middot; added' : '') + '</span>'
    + (m === 'absent' && !isOver(s) ? '<em>planned</em>' : '') + '</div>' + markSeg(s, true) + '</li>';
}
// A course's whole term: what has happened, newest first, then what is next.
// The expanded row used to show only what was to come, so an absence from
// week one was nine Previous clicks away on the Week grid.
function courseHistory(code){
  const all = sessions().filter(s => s.code === code && s.counted);
  const past = all.filter(isOver).reverse();
  const next = all.filter(s => !isOver(s)).slice(0, 10);
  return '<h4 class="sub-h">Already held &middot; ' + past.length + '</h4>'
    + (past.length ? '<ul class="upnext scroll">' + past.map(s => sessionRow(s, true)).join('') + '</ul>'
                   : '<p class="tiny muted" style="margin:6px 0 0">Nothing held yet' + (S.countFrom ? ' since you started counting' : '') + '.</p>')
    + '<h4 class="sub-h">Next ' + (next.length || '') + '</h4>'
    + (next.length ? '<ul class="upnext">' + next.map(s => sessionRow(s, true)).join('') + '</ul>'
                   : '<p class="tiny muted" style="margin:6px 0 0">Nothing left on the calendar for this course.</p>');
}

// The first thing a new or never-checked profile sees. Every past class counts
// as attended until something says otherwise - imported on 19 Oct, that was
// 116 classes and 155h credited without a word and 100.0% on every course.
// So the page asks, once, which of three things is true.
function startupCard(){
  if(S.reviewedThrough) return '';
  const n = uncheckedCount(); if(!n) return '';
  const logged = Object.keys(S.log).length;
  const from = prettyDate(countFrom());
  return '<section class="card startup"><h2>Before these numbers mean anything</h2>'
    + '<p>' + n + ' class' + (n===1?' has':'es have') + ' been held since ' + esc(from) + '. '
    + (logged ? 'You have marked ' + logged + ' of them; every other one counts as attended because nothing says otherwise.'
              : 'This app has no record of any of them, so each one counts as attended - which is why every course reads as high as it does.')
    + ' Which is true?</p>'
    + '<div class="row"><button class="btn primary" id="su-check">I missed some - check them week by week</button>'
    + '<button class="btn" id="su-today">I have no records - count from today</button>'
    + '<button class="btn" id="su-all">' + (logged ? 'My log is up to date' : 'I attended all of them') + '</button></div>'
    + '<p class="tiny muted" style="margin:12px 0 0">Counting from today drops the past from every figure here; the registrar still counts it, so Log &rsaquo; Reconcile is where the two meet.</p></section>';
}
function caveatLine(){
  if(!S.reviewedThrough) return '';
  const n = uncheckedCount(); if(!n) return '';
  return '<p class="caveat"><span><b>' + n + ' unchecked class' + (n===1?'':'es') + '</b> since '
    + esc(prettyDate(addDays(S.reviewedThrough, 1))) + ' ' + (n===1?'is':'are') + ' counted as attended in the figures below.</span>'
    + '<button class="btn small" data-go="log">Check in</button></p>';
}

// --- Overview --------------------------------------------------------------

// One bar, drawn to scale, used by the hero, every course row and term
// progress. `fill` and `tick` are percentages of the same 0-100 axis, so the
// gap between the filled edge and the tick is the budget, at a glance and
// without arithmetic. tick null draws no threshold - term progress is measured
// against nothing.
function gauge(fill, tick, state, label){
  const f = Math.max(0, Math.min(100, fill));
  return '<div class="gauge ' + (state || '') + '"'
    + (label ? ' role="img" aria-label="' + esc(label) + '"' : ' aria-hidden="true"') + '>'
    + '<i style="width:' + f.toFixed(1) + '%"></i>'
    + (tick == null ? '' : '<b style="left:' + Math.max(0, Math.min(100, tick)).toFixed(1) + '%"></b>')
    + '</div>';
}

// Everything still to come, from right now. Shared by the rail card and by an
// expanded course row, which differ only in what they filter and how many they
// are willing to show.
function upcoming(pred, limit){
  const t = today(), now = new Date().getHours()*60 + new Date().getMinutes();
  const out = [];
  const all = sessions();
  for(let i = 0; i < all.length && out.length < limit; i++){
    const s = all[i];
    if(!s.counted) continue;
    if(s.date < t || (s.date === t && s.end <= now)) continue;
    if(pred(s)) out.push(s);
  }
  return out;
}

// The figure the hero sentence is arguing about. It was not on the page: the
// hero's largest type was the course code, and the percentage lived only in the
// list below the fold.
function heroStat(st){
  if(st.state === 'none'){
    return '<div class="hero-stat nodata"><div class="hero-pct">no data yet</div>'
      + '<div class="hero-lab">this course</div>'
      + '<p class="hero-fig">Nothing has been held, so there is no percentage to weigh an absence against. '
      + h1(st.total) + 'h is scheduled in total.</p></div>';
  }
  return '<div class="hero-stat ' + st.state + '">'
    + '<div class="hero-pct">' + pctText(st.pct) + '</div>'
    + '<div class="hero-lab">attended in ' + esc(st.code) + '</div>'
    + gauge(st.pct*100, st.thr*100, st.state,
        pctText(st.pct) + ' attended against a ' + Math.round(st.thr*100) + ' percent bar')
    + '<p class="hero-fig"><b>' + hDown(st.budgetHours) + 'h</b> of leave left &middot; bar '
    + Math.round(st.thr*100) + '%<br>' + h1(st.attended) + 'h of ' + h1(st.held) + 'h held</p></div>';
}

function heroView(){
  const s0 = nextSession();
  if(!s0){
    const done = S.courses.length ? 'No class left on the calendar. The term ends ' + prettyDate(CALENDAR.end) + '.'
                                  : 'Load a timetable and this is where the next class will be.';
    return '<section class="hero"><div class="hero-main"><div class="hero-k">Next up</div>'
      + '<p class="hero-code" style="font-size:1.4rem">Nothing scheduled</p>'
      + '<p class="hero-none">' + esc(done) + '</p></div></section>';
  }
  const c  = S.courses.find(x => x.code === s0.code) || {};
  const st = stats(s0.code);
  const mark = markOf(s0);
  // What the budget becomes if this one is missed. The figure already excludes
  // future classes marked absent, so an unmarked class costs exactly its hours
  // and one already marked absent costs nothing more.
  const cost = mark === 'absent' ? 0 : s0.hours;
  const after = st.budgetHours - cost;
  let cost_line;
  if(mark === 'absent'){
    cost_line = 'You have marked this one absent already. ' + hDown(Math.max(0,st.budgetHours))
      + 'h of leave is what is left after it.';
  } else if(st.state === 'none'){
    cost_line = 'Skipping it costs <b>' + h1(s0.hours) + 'h</b>. Nothing has been held yet, so there is no percentage to weigh it against.';
  } else if(after < 0){
    cost_line = 'Skipping it costs <b>' + h1(s0.hours) + 'h</b>, which you do not have. It would put you under '
      + Math.round(st.thr*100) + '% in ' + esc(s0.code) + '.';
  } else {
    cost_line = 'Skipping it costs <b>' + h1(s0.hours) + 'h</b>. You would still have <b>'
      + hDown(after) + 'h</b> of leave in ' + esc(s0.code) + '.';
  }
  // No primary button here on purpose. A filled call-to-action reading "mark
  // absent" is an app nudging you to skip a class. These are three equal
  // statements of fact, and the one already true is pressed rather than
  // disabled - disabled greyed out the only accurate button on the row.
  return '<section class="hero ' + st.state + '">'
    + '<div class="hero-main">'
    + '<div class="hero-k">Next up <span class="hero-when">' + esc(whenLabel(s0)) + '</span></div>'
    + '<h3 class="hero-code">' + esc(s0.code) + '</h3>'
    + '<p class="hero-title">' + esc(c.title || '') + '</p>'
    + '<p class="hero-meta">' + hhmm(s0.start) + ' &ndash; ' + hhmm(s0.end) + ' &middot; ' + esc(s0.comp + ' ' + s0.sec)
    + (s0.room ? ' &middot; ' + esc(s0.room) : '') + ' &middot; ' + h1(s0.hours) + 'h</p>'
    + '<p class="hero-cost">' + cost_line + '</p></div>'
    + heroStat(st)
    + '<div class="hero-actions">' + markSeg(s0)
    + '<span class="tiny muted">This one class, on ' + esc(prettyDate(s0.date)) + '.</span></div>'
    + '</section>';
}

// The next seven days, in the rail. Not a duplicate of the Week grid: the grid
// answers "where do I have to be", this answers "what is coming", and each one
// takes its mark from the same explicit buttons as everywhere else.
function upNextCard(){
  const lim = addDays(today(), 7);
  const rows = upcoming(s => s.date <= lim, 8);
  if(!rows.length){
    return '<div class="card"><h2>Next seven days</h2><p class="tiny muted" style="margin:0">'
      + 'No class between now and ' + prettyDate(lim) + '.</p></div>';
  }
  const hours = rows.reduce((a,s) => a + (markOf(s) === 'cancelled' ? 0 : s.hours), 0);
  return '<div class="card"><h2>Next seven days</h2>'
    + '<p class="tiny muted" style="margin:0">' + rows.length + ' class' + (rows.length===1?'':'es')
    + ' &middot; ' + h1(hours) + 'h. Mark one you already know you will skip.</p>'
    + '<ul class="upnext">' + rows.map(s => sessionRow(s, true)).join('') + '</ul></div>';
}

function countFromCard(){
  const cf = countFrom(), x = excluded();
  const on = S.countFrom && S.countFrom > CALENDAR.start;
  return '<div class="card"><h2>Start counting from</h2>'
    + '<p class="tiny muted">The day you actually started keeping records. Classes before it still show on the Week grid, greyed out, but count toward nothing. The start-up question sets this for you if you pick \'count from today\'.</p>'
    + '<div class="row"><label class="field">Date<input type="date" id="cf-date" value="' + cf
    + '" min="' + CALENDAR.start + '" max="' + CALENDAR.end + '"></label></div>'
    + '<p class="tiny ' + (on ? 'est' : 'muted') + '" style="margin:12px 0 0">'
    + (on ? x.n + ' session' + (x.n===1?'':'s') + ' &middot; ' + h1(x.hours) + 'h excluded'
          : 'Counting the whole term, from ' + prettyDate(CALENDAR.start) + '.') + '</p>'
    + (on ? '<div style="margin-top:10px"><button class="btn small" id="cf-reset">Count the whole term instead</button></div>' : '')
    + '<div id="cf-msg"></div></div>';
}

// Collapsed by default. A per-course bar is set once a semester from a
// syllabus, and open it was 428px of number inputs sitting above the figures
// this page is read for. Held and Left still show on every course row.
let barOpen = false;
function barCard(all){
  return '<details class="disclose" id="bar-details"' + (barOpen ? ' open' : '') + '>'
    + '<summary>Attendance bar &middot; ' + Math.round(DEFAULT_THRESHOLD*100) + '% default</summary>'
    + '<div class="body">'
    + '<p class="tiny muted">' + Math.round(DEFAULT_THRESHOLD*100) + '% unless a syllabus sets its own. '
    + 'Changing one here changes every figure on this page for that course.</p>'
    + '<div class="tablewrap"><table><thead><tr><th>Course</th><th class="num">Bar</th><th class="num">Held</th><th class="num">Left</th></tr></thead><tbody>'
    + all.map(({c, st}) => '<tr><td>' + esc(c.code) + '</td>'
      + '<td class="num"><input type="number" min="1" max="100" step="1" style="width:62px" data-thr="' + esc(c.code) + '" value="' + Math.round(st.thr*100) + '"></td>'
      + '<td class="num">' + h1(st.held) + 'h</td>'
      + '<td class="num">' + hDown(st.budgetHours) + 'h</td></tr>').join('')
    + '</tbody></table></div></div></details>';
}

// Term progress. Not a duplicate of anything else on the page: the course rows
// answer "how am I doing", this answers "how much term is left to do it in",
// which is what decides whether a shortfall is still recoverable.
function progressCard(all){
  let held = 0, total = 0, future = 0;
  all.forEach(({st}) => { held += st.held; total += st.total; future += st.future; });
  const pct = total ? held/total : 0;
  const dayOf = d => Math.round((fromYmd(d) - fromYmd(CALENDAR.start)) / 86400000);
  const span = dayOf(CALENDAR.end);
  const elapsed = Math.max(0, Math.min(dayOf(today()), span));
  return '<div class="card"><h2>Term progress</h2>'
    + '<div class="hero-pct" style="font-size:1.9rem">' + Math.round(pct*100) + '%</div>'
    + '<div class="hero-lab">of the term held</div>'
    + gauge(pct*100, null, '', Math.round(pct*100) + ' percent of scheduled hours already held')
    + '<p class="tiny muted" style="margin:10px 0 0"><b class="num">' + h1(held) + 'h</b> of <b class="num">'
    + h1(total) + 'h</b> scheduled has been held. <b class="num">'
    + h1(future) + 'h</b> still to come.</p>'
    + '<p class="tiny muted" style="margin:8px 0 0">Day ' + elapsed + ' of ' + span + '. Ends '
    + prettyDate(CALENDAR.end) + '.</p></div>';
}

// Leave in the unit a student decides in. The class count is floored against
// the longest class still to come, exactly as stats() derives it.
function leaveCell(st){
  if(st.state === 'over') return '<b>under the bar</b><span>' + hUp(st.shortHours) + 'h short</span>';
  return '<b>' + st.budgetSessions + ' class' + (st.budgetSessions===1?'':'es') + '</b><span>' + hDown(st.budgetHours) + 'h</span>';
}

function overviewView(){
  const all = S.courses.map(c => ({c, st: stats(c.code)}));
  // Worst first. What you open this page to find out is which course is in
  // trouble, not which one is fine.
  all.sort((a,b) => {
    const rank = {over:0, close:1, safe:2, none:3};
    return rank[a.st.state] - rank[b.st.state] || (a.st.budgetHours - b.st.budgetHours);
  });
  const unchk = {};
  if(S.reviewedThrough) uncheckedSessions().forEach(s => { if(markOf(s) !== 'cancelled') unchk[s.code] = (unchk[s.code]||0) + 1; });
  const list = all.map(({c, st}) => {
    const open = openCourse === c.code;
    const nx = upcoming(s => s.code === c.code, 1)[0];
    const pct = st.pct == null ? 'no data' : pctText(st.pct);
    let panel = '';
    if(open){
      const u = unchk[c.code];
      panel = '<div class="cx"><p class="line">' + esc(stateLine(st))
        + (u ? ' <span class="est">' + u + ' of the classes behind this are unchecked.</span>' : '') + '</p>'
        + (st.pct == null ? '' : '<div class="meter">' + gauge(st.pct*100, st.thr*100, st.state,
            pct + ' attended in ' + c.code + ', against a ' + Math.round(st.thr*100) + ' percent bar')
            + '<em>bar ' + Math.round(st.thr*100) + '%</em></div>')
        + '<p class="subl">' + h1(st.attended) + 'h attended of ' + h1(st.held) + 'h held &middot; ' + h1(st.total) + 'h scheduled in all</p>'
        + courseHistory(c.code) + '</div>';
    }
    return '<article class="course ' + st.state + '">'
      + '<div class="crow" data-course="' + esc(c.code) + '">'
      + '<div class="cwho"><button class="code" data-course="' + esc(c.code) + '" aria-expanded="' + open + '">'

      + '<div class="cfig cleave"><span class="lab">Leave </span>' + leaveCell(st) + '</div>'
      + '<div class="cfig cmiss"><span class="lab">Missed </span><b>' + st.nAbsent + '</b><span>' + h1(st.absent) + 'h</span></div>'

      + '</div>' + panel + '</article>';

    + list + '</div>'

}

// --- Week view -------------------------------------------------------------

function weekMonday(k){ const d = fromYmd(k); const off = (d.getDay()+6)%7; return addDays(k, -off); }

function weekView(){
  const mon = S.week || weekMonday(today());
  const weekDates = DAYS.map((_,i) => addDays(mon, i));
  const inWeek = sessions().filter(s => s.date >= weekDates[0] && s.date <= weekDates[5]);
  let gs = DEFAULT_GRID_START, ge = DEFAULT_GRID_END;
  inWeek.forEach(s => { gs = Math.min(gs, s.start); ge = Math.max(ge, s.end); });
  gs = Math.floor(gs/60)*60; ge = Math.ceil(ge/60)*60;
  const hours = (ge-gs)/60, H = hours*60*PX_PER_MIN;
  const off = new Set(CALENDAR.off||[]);

  let h = '<div class="row" style="margin-bottom:10px">'
    + '<button class="btn small" data-week="-1">&larr; Previous</button>'
    + '<button class="btn small" data-week="0">This week</button>'
    + '<button class="btn small" data-week="1">Next &rarr;</button>'
    + '<span class="muted tiny">'+prettyDate(weekDates[0])+' – '+prettyDate(weekDates[5])
    + ' · click a class to mark it</span></div>';

  if(!inWeek.length && (weekDates[5] < CALENDAR.start || weekDates[0] > CALENDAR.end))
    h += '<div class="banner warn"><b>Outside the semester</b>This week falls before '+prettyDate(CALENDAR.start)+' or after '+prettyDate(CALENDAR.end)+', so it holds no sessions.</div>';

  h += '<div class="gridwrap"><div class="gridhead"><div></div>'
    + DAYS.map((d,i) => '<div class="'+(weekDates[i]===today()?'today':'')+'">'+d+'<br><span class="tiny">'+fromYmd(weekDates[i]).getDate()+'</span></div>').join('')
    + '</div><div class="gridbody">'
    + '<div class="timecol" style="height:'+H+'px">'
    + Array.from({length:hours+1}, (_,i) => '<span style="top:'+(i*60*PX_PER_MIN)+'px">'+hhmm(gs+i*60)+'</span>').join('')
    + '</div>';

  DAYS.forEach((d,i) => {
    const date = weekDates[i];
    const isOff = off.has(date) || date < CALENDAR.start || date > CALENDAR.end;
    h += '<div class="daycol'+(isOff?' offday':'')+'" style="height:'+H+'px">'
      + Array.from({length:hours}, (_,j) => '<div class="hourline" style="top:'+(j*60*PX_PER_MIN)+'px"></div>').join('');
    inWeek.filter(s => s.date === date).forEach(s => {
      const mark = markOf(s);
      const top = Math.max(0, (s.start-gs)*PX_PER_MIN);
      const ht = Math.max(34, (s.end - s.start)*PX_PER_MIN);
      // A session before the count-from date is drawn but not clickable: it can
      // hold no mark that would change a number, and a control that silently
      // does nothing is worse than one that is visibly off.
      const cls = s.counted ? mark + (s.extra?' extra':'') : 'uncounted';
      const tip = s.counted ? MARK_WORD[mark] + (mark === 'absent' && !isOver(s) ? ' (planned)' : '') : 'not counted - before ' + prettyDate(countFrom());
      h += '<button class="blk '+cls+'" '+(s.counted ? 'data-sid="'+esc(s.id)+'"' : 'disabled')
        + ' style="top:'+top+'px;height:'+ht+'px" '
        + 'title="'+esc(s.code+' '+s.comp+' '+s.sec+' · '+h1(s.hours)+'h · '+tip)+'">'
        + '<span class="tag">'+(s.counted ? (s.extra?'added · ':'')+MARK_WORD[mark]+(mark==='absent' && !isOver(s)?' · planned':'') : 'not counted')+(s.swapped?' · swap':'')+'</span>'
        + '<b>'+esc(s.code)+'</b>'+esc(s.comp)+' '+hhmm(s.start)+'</button>';
    });
    h += '</div>';
  });
  h += '</div></div>';

  h += '<div class="card" style="margin-top:14px"><h2>Add an extra class</h2>'
    + '<p class="tiny muted">A make-up or an unscheduled session. It counts toward both what was held and the semester total, and shows on the grid with a dashed border.</p>'
    + '<div class="row"><label class="field">Course<select id="ex-code">'
    + S.courses.map(c => '<option value="'+esc(c.code)+'">'+esc(c.code)+'</option>').join('')
    + '</select></label>'
    + '<label class="field">Date<input type="date" id="ex-date" value="'+today()+'" min="'+CALENDAR.start+'" max="'+CALENDAR.end+'"></label>'
    + '<label class="field">Start<input type="time" id="ex-start" value="10:00"></label>'
    + '<label class="field">End<input type="time" id="ex-end" value="10:55"></label>'
    + '<button class="btn primary" id="ex-add">Add</button></div><div id="ex-msg"></div>';
  if((S.extras||[]).length){
    h += '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Course</th><th>Date</th><th>Time</th><th class="num">Hours</th><th></th></tr></thead><tbody>'
      + S.extras.map((x,i) => '<tr><td>'+esc(x.code)+'</td><td>'+prettyDate(x.date)+'</td><td>'+hhmm(x.start)+'–'+hhmm(x.end)+'</td>'
        + '<td class="num">'+h1(contactHours(x.start,x.end))+'h</td>'
        + '<td><button class="btn small" data-rmex="'+i+'">Remove</button></td></tr>').join('')
      + '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}

// The official record is the authority; this app is not. So reconcile reports
// the gap and offers candidates, and every flip is your click. It never edits
// itself to agree with a figure you typed - that would launder a typo into a
// budget you then trust.
//
// It takes either "84.4" or "27/32". A percentage used to be the only form,
// converted to hours against this app's own held hours - wrong by exactly the
// excluded weeks once a count-from date was set. A count is compared in
// classes against the registrar's own denominator, so that error cannot arise.
function parseOfficial(v){
  if(v == null || v === '') return null;
  const t = String(v).trim().replace(/%$/, '').trim();
  const m = t.match(/^(\d+)\s*(?:\/|of)\s*(\d+)$/i);
  if(m){ const att = +m[1], held = +m[2]; return (held > 0 && att <= held) ? {kind:'count', att, held} : {bad:true}; }
  const n = Number(t);
  return (t !== '' && isFinite(n) && n >= 0 && n <= 100) ? {kind:'pct', pct:n} : {bad:true};
}
function reconcileCard(){
  let h = '<div class="card"><h2>Reconcile against the official record</h2>'
    + '<p class="tiny muted">Type what the official record shows: a percentage like <code>84.4</code>, or classes attended of held like <code>27/32</code>. This app reports the difference and lists classes you could flip. It changes nothing on its own.</p>';
  S.courses.forEach(c => {
    const st = stats(c.code);
    const raw = S.official[c.code];
    const o = parseOfficial(raw);
    h += '<div class="ckday"><div class="spread"><h4>' + esc(c.code) + '</h4>'
      + '<span class="tiny muted">this app: ' + (st.pct == null ? '—' : pctText(st.pct)) + ', ' + (st.nHeld - st.nAbsent) + ' of ' + st.nHeld + ' classes</span></div>'
      + '<div class="row" style="margin-top:6px"><label class="field">Official record<input type="text" inputmode="decimal" style="width:16ch" data-off="'
      + esc(c.code) + '" value="' + esc(raw == null ? '' : raw) + '" placeholder="84.4 or 27/32"></label>';
    let want = null, gapTxt = '';
    if(o && o.bad) gapTxt = '<span class="tiny est">That is not a figure this can read. Type 84.4 or 27/32.</span>';
    else if(o && st.nHeld){
      if(o.kind === 'count'){
        const offMiss = o.held - o.att, gap = offMiss - st.nAbsent;    // + means the record has more absences
        gapTxt = (gap === 0 ? 'Same number of absences as the record: ' + offMiss + '.'
               : gap > 0 ? 'The record has <b>' + gap + '</b> more absence' + (gap===1?'':'s') + ' than this app. You likely forgot to log ' + (gap===1?'one':'them') + '.'
                         : 'This app has <b>' + (-gap) + '</b> more absence' + (gap===-1?'':'s') + ' than the record. You likely logged one you did not take.')
          + (o.held !== st.nHeld ? ' The record counts ' + o.held + ' classes held, this app ' + st.nHeld + ' - a cancellation or the count-from date accounts for the difference.' : '');
        if(gap) want = gap > 0 ? 'attended' : 'absent';
      } else {
        const gap = st.attended - o.pct/100*st.held;                    // + means this app over-credits
        const approx = Math.round(Math.abs(gap)/st.step*10)/10;
        gapTxt = Math.abs(gap) < 0.05 ? 'Agrees within half a percent. Nothing to flip.'
          : gap > 0 ? 'This app credits you <b>' + h1(gap) + 'h</b> more than the record does (about ' + approx + ' classes). You likely forgot to log an absence.'
                    : 'The record credits you <b>' + h1(-gap) + 'h</b> more than this app does (about ' + approx + ' classes). You likely logged an absence you did not take.';
        if(Math.abs(gap) >= 0.05) want = gap > 0 ? 'attended' : 'absent';
        if(S.countFrom) gapTxt += ' A percentage is compared against this app\'s held hours, which leave out the weeks before your count-from date - type the record as 27/32 for an exact comparison.';
      }
      gapTxt = '<span class="tiny">' + gapTxt + '</span>';
    }
    h += gapTxt + '</div>';
    if(want){
      // Most recent first: the class you forgot to log is almost always a recent one.
      const cands = sessions().filter(s => s.code === c.code && s.counted && s.date < today() && markOf(s) === want).reverse().slice(0, 12);
      h += cands.length ? '<ul class="upnext">' + cands.map(s => sessionRow(s, true)).join('') + '</ul>'
                        : '<p class="tiny muted">No class marked ' + MARK_WORD[want] + ' to flip.</p>';
    }
    h += '</div>';
  });
  return h + '</div>';
}

// --- Log: paste the portal's attendance table --------------------------------
//
// The portal is the official record, so its P and A overwrite whatever is
// logged here, including marks set by hand. The paste is read into a plan and
// shown as a diff; nothing is written until Apply, and Apply goes on the undo
// stack like every other change.
//
// Each block is "Course Code", N dates, then "CODE - LECL1  P P A ...". The
// dates are the classes the portal says were held, so they carry more than the
// P/A: a timetable class with no portal date was not held (cancelled), and a
// portal date with no timetable class is a make-up (added). Both are only
// proposals - a lecturer who has not entered attendance yet looks the same as
// a cancellation - so each is a tick box, and only dates before a block's last
// portal date are judged. A "-2" after a date is the second class that day.
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
let PORTAL = null;

function portalParse(text){
  const blocks = [], y0 = +CALENDAR.start.slice(0,4), m0 = +CALENDAR.start.slice(5,7);
  let dates = [];
  String(text).split(/\r?\n/).forEach(raw => {
    const line = raw.trim(); if(!line) return;
    if(/^course code$/i.test(line)){ dates = []; return; }
    let m = line.match(/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s*-\s*(\d+)$/);
    if(m){
      const mo = MONTHS[m[2].toLowerCase()]; if(!mo) return;
      const y = mo < m0 ? y0 + 1 : y0;
      dates.push({date: y+'-'+String(mo).padStart(2,'0')+'-'+m[1].padStart(2,'0'), n: +m[3]});
      return;
    }
    m = line.match(/^(\S+?)\s*-\s*([A-Za-z0-9]+)\s+(.+)$/);
    if(!m) return;
    const marks = m[3].trim().split(/\s+/).map(x => x.toUpperCase());
    const b = { code: m[1].toUpperCase(), token: m[2].toUpperCase(), entries: [], err: null, skipped: 0 };
    if(!dates.length) b.err = 'No dates above this row.';
    else if(dates.length !== marks.length) b.err = dates.length + ' dates but ' + marks.length + ' marks, so they cannot be paired. Re-copy the table.';
    else dates.forEach((d, i) => {
      if(marks[i] === 'P' || marks[i] === 'A') b.entries.push({date:d.date, n:d.n, mark: marks[i]});
      else b.skipped++;
    });
    blocks.push(b); dates = [];
  });
  return blocks;
}

// Turns parsed blocks into what an apply would write. Reads S, writes nothing.
function portalPlan(blocks){
  const plan = { rows: [], marks: {}, cancels: [], adds: [], through: null };
  const addIds = new Set(), all = sessions();
  blocks.forEach(b => {
    const row = { head: b.code + ' ' + b.token, n: b.entries.length, err: b.err, att: 0, abs: 0, changed: 0,
                  handset: 0, cancelled: [], added: [], unplaced: [], skipped: b.skipped, last: null };
    plan.rows.push(row);
    if(b.err) return;
    const c = S.courses.find(x => b.code.split('/').some(k => k === x.code || x.code.split('/').indexOf(k) >= 0));
    if(!c){ row.err = b.code + ' is not in the loaded timetable.'; return; }
    const comps = Array.from(new Set((c.meetings||[]).map(m => m.comp))).sort((a,z) => z.length - a.length);
    const comp = comps.find(k => b.token.indexOf(k.toUpperCase()) === 0);
    if(!comp){ row.err = c.code + ' has no component matching ' + b.token + ' (it has ' + comps.join(', ') + ').'; return; }
    row.head = c.code + ' ' + comp;
    const tmpl = c.meetings.find(m => m.comp === comp);
    const byDate = {}, xByDate = {};
    all.filter(s => s.code === c.code).forEach(s => {
      const g = s.extra ? xByDate : (s.comp === comp ? byDate : null); if(!g) return;
      (g[s.date] = g[s.date] || []).push(s);
    });
    const last = b.entries.reduce((a,e) => e.date > a ? e.date : a, '');
    row.last = last;
    const used = new Set();
    b.entries.forEach(e => {
      const want = e.mark === 'P' ? 'attended' : 'absent';
      e.mark === 'P' ? row.att++ : row.abs++;
      let s = (byDate[e.date]||[])[e.n-1] || (e.n === 1 ? (xByDate[e.date]||[])[0] : null);
      if(s){
        used.add(s.id); plan.marks[s.id] = want;
        const cur = markOf(s);
        if(cur !== want){ row.changed++; if(S.log[s.id]) row.handset++; }
        return;
      }
      const id = c.code+'|EXTRA|X|'+e.date+'|'+(tmpl && tmpl.start);
      if(!tmpl || e.date < CALENDAR.start || e.date > CALENDAR.end || addIds.has(id)){ row.unplaced.push(e.date); return; }
      addIds.add(id); row.added.push(e.date);
      plan.adds.push({ x:{code:c.code, date:e.date, start:tmpl.start, end:tmpl.end}, id, want });
    });
    Object.keys(byDate).forEach(d => byDate[d].forEach(s => {
      if(used.has(s.id) || s.date >= last || markOf(s) === 'cancelled') return;
      row.cancelled.push(s.date); plan.cancels.push(s.id);
      if(S.log[s.id]) row.handset++;
    }));
    // Everything up to the earliest block end is on the record for every course.
    const lim = last < lastDay() ? last : lastDay();
    if(plan.through === null || lim < plan.through) plan.through = lim;
  });
  return plan;
}

// What the paste says on its own, with no timetable loaded. Held, attended and
// the percentage are exact: they are the portal's own count. What is still to
// come is not on the portal at all, so it is projected from the weekdays the
// component has met on and tagged as an estimate. A weekday counts as regular
// when it holds at least half as many classes as the commonest one, so a
// Saturday make-up does not turn into a weekly class. Leave is in classes, each
// weighted equally; the app's hour-weighted budget needs the real timetable.
function portalDays(entries){
  const n = {}; entries.forEach(e => { const d = dowName(e.date); n[d] = (n[d]||0) + 1; });
  const top = Math.max.apply(null, Object.keys(n).map(k => n[k]));
  return Object.keys(n).filter(k => n[k]*2 >= top);
}
function portalRemaining(entries){
  const days = portalDays(entries), last = entries.reduce((a,e) => e.date > a ? e.date : a, '');
  const off = new Set(CALENDAR.off || []), swaps = CALENDAR.swaps || {};
  let rem = 0;
  for(let d = addDays(last, 1); d <= CALENDAR.end; d = addDays(d, 1)){
    if(off.has(d)) continue;
    const real = dowName(d); if(real === 'Sun' && !swaps[d]) continue;
    if(days.indexOf(swaps[d] || real) >= 0) rem++;
  }
  return rem;
}
function portalVerdict(code, att, held, rem){
  const thr = thresholdOf(code), bar = Math.round(thr*100) + '%';
  if(att >= thr*held - 1e-9){
    const n = Math.max(0, Math.min(rem, Math.floor(att + rem - thr*(held + rem) + 1e-9)));
    return n ? 'can miss <b>' + n + '</b> more at ' + bar : 'no leave left at ' + bar;
  }
  const k = Math.ceil((thr*held - att)/(1 - thr) - 1e-9);
  return k <= rem ? 'under ' + bar + ': attend the next <b>' + k + '</b> in a row' : '<span class="est">under ' + bar + ', cannot be recovered</span>';
}
function portalSummary(blocks){
  const rows = [], byCode = {};
  blocks.forEach(b => {
    if(b.err || !b.entries.length) return;
    const att = b.entries.filter(e => e.mark === 'P').length, held = b.entries.length;
    const last = b.entries.reduce((a,e) => e.date > a ? e.date : a, '');
    const r = { label: b.code + ' ' + b.token, code: b.code, att, held, rem: portalRemaining(b.entries), last };
    rows.push(r); (byCode[b.code] = byCode[b.code] || []).push(r);
  });
  if(!rows.length) return '';
  Object.keys(byCode).forEach(k => {
    const g = byCode[k]; if(g.length < 2) return;
    const t = { label: k + ' all, if pooled', code: k, att: 0, held: 0, rem: 0, pooled: true };
    g.forEach(r => { t.att += r.att; t.held += r.held; t.rem += r.rem; });
    rows.splice(rows.indexOf(g[g.length-1]) + 1, 0, t);
  });
  const old = rows.filter(r => r.last && r.last < addDays(today(), -14));
  return '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Class</th><th class="num">Attended</th><th class="num">Percent</th>'
    + '<th class="num">To come <span class="est">est.</span></th><th>Verdict <span class="est">est.</span></th></tr></thead><tbody>'
    + rows.map(r => '<tr' + (r.pooled ? ' class="muted"' : '') + '><td style="white-space:nowrap">' + esc(r.label) + '</td><td class="num">' + r.att + ' / ' + r.held + '</td>'
      + '<td class="num">' + pctText(r.att/r.held) + '</td><td class="num">' + r.rem + '</td><td style="min-width:26ch">' + portalVerdict(r.code, r.att, r.held, r.rem) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<p class="tiny muted" style="margin:8px 0 0">Attended, held and percent are the portal\'s own count. <b>To come</b> is not on the portal: it assumes each class keeps meeting on its usual weekdays until ' + esc(prettyDate(CALENDAR.end)) + ', minus the calendar\'s off days. Leave counts classes, not hours.'
    + (old.length ? ' <span class="est">' + esc(old.map(r => r.label).join(', ')) + ' last met more than two weeks ago; if that class has ended, nothing is still to come.</span>' : '') + '</p>';
}

function portalCard(){
  return '<div class="card"><h2>Paste the portal record</h2>'
    + '<p class="tiny muted">Copy the attendance table from the university portal and paste it here.'
    + (S.courses.length ? ' The portal is the official record, so its P and A <b>overwrite</b> marks logged here, including ones you set by hand. Nothing is written until you press Apply, and Apply can be undone.'
                        : ' With no timetable loaded this gives each class\'s percentage and leave straight from the paste, and saves nothing.') + '</p>'
    + '<label class="field">Portal table<textarea id="pt-text" rows="4" spellcheck="false" placeholder="Course Code&#10;17 Aug-1 ...&#10;DOM207 - LECL1   P   P   A ..."></textarea></label>'
    + '<div id="pt-diff"></div></div>';
}

const dateList = ds => ds.slice(0, 8).map(prettyDate).join(', ') + (ds.length > 8 ? ' and ' + (ds.length-8) + ' more' : '');
function portalShow(){
  const out = $('#pt-diff'); if(!out) return;
  const text = $('#pt-text').value.trim();
  PORTAL = null;
  if(!text){ out.innerHTML = ''; return; }
  const blocks = portalParse(text);
  if(!blocks.length){ out.innerHTML = '<div class="msg err" role="status">No attendance rows found. Copy from the "Course Code" line down to the last P/A row.</div>'; return; }
  const sum = portalSummary(blocks);
  if(!S.courses.length){
    out.innerHTML = (sum || '<div class="msg err" role="status">No block could be read.</div>')
      + blocks.filter(b => b.err).map(b => '<p class="tiny est" style="margin:6px 0 0">' + esc(b.code + ' ' + b.token + ': ' + b.err) + '</p>').join('')
      + '<p class="tiny muted" style="margin:10px 0 0">Nothing is saved. Load a timetable from Bob in Settings to log these marks class by class.</p>';
    return;
  }
  const p = portalPlan(blocks), good = p.rows.filter(r => !r.err);
  const changed = good.reduce((a,r) => a + r.changed, 0), handset = good.reduce((a,r) => a + r.handset, 0);
  const rt = p.through && (!S.reviewedThrough || p.through > S.reviewedThrough) ? p.through : null;
  const useful = changed + p.cancels.length + p.adds.length + (rt ? 1 : 0);
  let h = sum;
  p.rows.forEach(r => {
    h += '<div class="ckday"><div class="spread"><h4>' + esc(r.head) + '</h4><span class="tiny muted">' + r.n + ' classes on the record</span></div>';
    if(r.err){ h += '<p class="tiny est" style="margin:4px 0 0">' + esc(r.err) + ' Skipped.</p></div>'; return; }
    h += '<p class="tiny" style="margin:4px 0 0">' + r.att + ' attended, ' + r.abs + ' missed. '
      + (r.changed ? '<b>' + r.changed + '</b> change here' + (r.handset ? ' (' + r.handset + ' set by hand are overwritten)' : '') + '.' : 'Already matches.');
    if(r.cancelled.length) h += '<br>Not on the portal, proposed cancelled: ' + esc(dateList(r.cancelled)) + '.';
    if(r.added.length) h += '<br>Not on the timetable, proposed make-up: ' + esc(dateList(r.added)) + '.';
    if(r.unplaced.length) h += '<br><span class="est">Cannot place: ' + esc(dateList(r.unplaced)) + ' (outside the term, or no meeting time to copy).</span>';
    if(r.skipped) h += '<br><span class="est">' + r.skipped + ' mark(s) were neither P nor A and were ignored.</span>';
    h += '</p></div>';
  });
  if(!useful){ out.innerHTML = h + '<div class="msg ok" role="status" style="margin-top:12px">Nothing to change: this app already agrees with the portal.</div>'; return; }
  PORTAL = Object.assign(p, {rt});
  const ck = (id, n, text) => n ? '<label class="ptck"><input type="checkbox" id="' + id + '" checked><span class="tiny">' + text + '</span></label>' : '';
  h += '<div style="margin-top:12px">'
    + ck('pt-cancel', p.cancels.length, 'Cancel the <b>' + p.cancels.length + '</b> class' + (p.cancels.length===1?'':'es') + ' the portal does not list. A cancelled class leaves the count, which can raise your percentage; untick it if a lecturer may just not have entered attendance yet.')
    + ck('pt-add', p.adds.length, 'Add the <b>' + p.adds.length + '</b> class' + (p.adds.length===1?'':'es') + ' the portal lists that your timetable does not, as make-ups, using that component\'s usual time.')
    + ck('pt-through', rt ? 1 : 0, 'Mark classes up to <b>' + esc(prettyDate(rt || '')) + '</b> as checked, since the portal covers them. Classes after a course\'s last portal date stay as they are.')
    + '</div><div class="row" style="margin-top:12px"><button class="btn primary" id="pt-ok">Apply the portal record</button> <button class="btn" id="pt-clear">Clear</button></div>';
  out.innerHTML = h;
}
function applyPortal(){
  const p = PORTAL; if(!p) return;
  const on = id => { const e = $(id); return !!(e && e.checked); };
  const was = {extras: S.extras.slice(), reviewedThrough: S.reviewedThrough};
  const g = {attended:[], absent:[], cancelled:[]};
  Object.keys(p.marks).forEach(id => g[p.marks[id]].push(id));
  const nAdd = on('#pt-add') ? p.adds.length : 0, nCan = on('#pt-cancel') ? p.cancels.length : 0;
  if(nAdd) p.adds.forEach(a => { S.extras.push(a.x); g[a.want].push(a.id); });
  if(nCan) p.cancels.forEach(id => g.cancelled.push(id));
  const before = {};
  Object.keys(g).forEach(k => Object.assign(before, writeMarks(g[k], k)));
  if(p.rt && on('#pt-through')) S.reviewedThrough = p.rt;
  invalidate(); save(); PORTAL = null;
  remember('Applied the portal record: ' + Object.keys(before).length + ' mark' + (Object.keys(before).length===1?'':'s') + ' changed, ' + nCan + ' cancelled, ' + nAdd + ' added', before, was);
  render();
}
