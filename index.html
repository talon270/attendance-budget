// --- Leave: the live planner ----------------------------------------------
//
// Whole days only. A day you plan off prices every class you would still have
// that day as missed, through stats() with a what-if set, and every other day
// is re-judged against the plan so far. The yes/no reads stats()'s raw budget,
// never the floored figure on screen: the planner must not round in your
// favour any more than the Overview may.

const MAX_BREAK = 9;      // longest window "Breaks you can afford" looks at, in days
const MAX_SKIP  = 3;      // most class days one suggested break may ask you to skip
const MAX_BREAKS = 6;     // how many suggestions are shown
let planFocus = null;     // the day last clicked, described under the calendar

// The classes on day d you could still skip: counted, not cancelled, not over.
function skippable(d){ return sessions().filter(s => s.date === d && s.counted && markOf(s) !== 'cancelled' && !isOver(s)); }
function planSet(days){ const set = new Set(); days.forEach(d => skippable(d).forEach(s => set.add(s.id))); return set; }
function dayKind(d){
  if((CALENDAR.off || []).indexOf(d) >= 0) return 'off';
  if(dowName(d) === 'Sun' && !(CALENDAR.swaps || {})[d]) return 'sun';
  if(skippable(d).length) return 'teach';
  // Classes happened today and all are over: not a day off, nothing to plan.
  return sessions().some(s => s.date === d && s.counted && markOf(s) !== 'cancelled') ? 'done' : 'free';
}
// The worst a set of what-if absences does to the courses in `codes`.
// no: some course ends the term under its bar. tight: none does, but one is
// left with less than one class of leave. ok: neither.
function verdict(set, codes){
  let worst = null, tight = null;
  codes.forEach(code => {
    const st = stats(code, set);
    if(st.budget < -1e-9){ if(!worst || st.budget < worst.budget) worst = st; }
    else if(st.budget < st.step - 1e-9 && !tight) tight = st;
  });
  return worst ? {k:'no', st:worst} : tight ? {k:'tight', st:tight} : {k:'ok'};
}
function costText(list){
  const by = {};
  list.forEach(s => by[s.code] = (by[s.code] || 0) + s.hours);
  return Object.keys(by).map(c => c + ' ' + h1(by[c]) + 'h').join(', ');
}
function verdictText(v){
  if(v.k === 'no') return 'puts ' + v.st.code + ' ' + hUp(-v.st.budget) + 'h under ' + Math.round(v.st.thr*100) + '% by the end of term';
  if(v.k === 'tight') return 'affordable, but leaves ' + v.st.code + ' with less than one class of leave';
  return 'affordable';
}

// The days from today to the end of term, each with its kind and, for a
// class day, its verdict on top of the plan as it stands.
function judgeDays(plan){
  const base = planSet(plan), out = {};
  for(let d = today(); d <= CALENDAR.end; d = addDays(d, 1)){
    const k = dayKind(d), o = {k};
    if(k === 'teach'){
      o.list = skippable(d);
      if(plan.indexOf(d) >= 0) o.v = {k:'planned'};
      else {
        const set = new Set(base); o.list.forEach(s => set.add(s.id));
        o.v = verdict(set, Array.from(new Set(o.list.map(s => s.code))));
      }
    }
    out[d] = o;
  }
  return out;
}

// Breaks you can afford. Every window of up to MAX_BREAK days from today in
// which each day is either already off (a holiday, a Sunday, a day with no
// class of yours, a day already planned) or a class day you would skip, with
// at most MAX_SKIP skipped. A window starts where the day before it is a class
// day and stops where the next one is, so it cannot be stretched by one more
// free day. Kept only if affordable on top of the current plan. Ranked by days
// off per day skipped, then by hours spent.
// ponytail: exhaustive over ~45 days x 9 lengths, each priced with stats();
// cheap at one term, would want per-course caching for a year-long calendar.
function breaks(plan, days){
  const ds = Object.keys(days).sort();
  const free = d => { const k = days[d] && days[d].k; return k === 'off' || k === 'sun' || k === 'free' || plan.indexOf(d) >= 0; };
  const base = planSet(plan), out = [];
  for(let i = 0; i < ds.length; i++){
    if(i > 0 && free(ds[i-1])) continue;
    const skip = [];
    for(let j = i; j < ds.length && j < i + MAX_BREAK; j++){
      const d = ds[j];
      if(days[d].k === 'done') break;
      if(!free(d)){ skip.push(d); if(skip.length > MAX_SKIP) break; }
      if(ds[j+1] && free(ds[j+1])) continue;
      const len = j - i + 1;
      if(!skip.length || len === skip.length) continue;
      const list = [].concat.apply([], skip.map(x => days[x].list));
      const set = new Set(base); list.forEach(s => set.add(s.id));
      if(verdict(set, S.courses.map(c => c.code)).k === 'no') continue;
      out.push({from: ds[i], to: d, len, skip: skip.slice(), list, hours: list.reduce((a,s) => a + s.hours, 0)});
    }
  }
  out.sort((a,b) => (b.len/b.skip.length - a.len/a.skip.length) || (a.hours - b.hours) || (a.from < b.from ? -1 : 1));
  return out.slice(0, MAX_BREAKS);
}

function leaveCalendar(days){
  const ds = Object.keys(days).sort();
  if(!ds.length) return '<p class="tiny muted">The term is over.</p>';
  let h = '<div class="months lmonths">';
  let cur = fromYmd(ds[0]); cur.setDate(1);
  const last = fromYmd(ds[ds.length-1]), t = today();
  while(cur <= last){
    const y = cur.getFullYear(), m = cur.getMonth();
    h += '<div class="month card"><h3>' + cur.toLocaleDateString(undefined,{month:'long', year:'numeric'}) + '</h3><div class="lgrid">'
      + ['M','T','W','T','F','S','S'].map(d => '<div class="dow">' + d + '</div>').join('');
    const lead = (new Date(y,m,1).getDay()+6)%7;
    for(let i = 0; i < lead; i++) h += '<div class="lday blank"></div>';
    const dim = new Date(y,m+1,0).getDate();
    for(let dd = 1; dd <= dim; dd++){
      const k = ymd(new Date(y,m,dd)), o = days[k], tc = k === t ? ' today' : '';
      const swap = (CALENDAR.swaps || {})[k];
      if(!o){ h += '<div class="lday done' + tc + '"><span class="n">' + dd + '</span></div>'; continue; }
      if(o.k !== 'teach'){
        const lab = o.k === 'off' ? 'holiday' : o.k === 'free' ? 'free' : o.k === 'done' ? 'done' : '';
        h += '<div class="lday ' + o.k + tc + '"><span class="n">' + dd + '</span><small>' + lab + '</small></div>';
        continue;
      }
      const hrs = o.list.reduce((a,s) => a + s.hours, 0);
      const tip = prettyDate(k) + ': ' + costText(o.list) + ' - ' + (o.v.k === 'planned' ? 'planned off' : verdictText(o.v));
      h += '<button class="lday ' + o.v.k + tc + (planFocus === k ? ' focus' : '') + '" data-plan="' + k + '" aria-pressed="' + (o.v.k === 'planned')
        + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '"><span class="n">' + dd + '</span><small>'
        + o.list.length + ' cls</small><small>' + h1(hrs) + 'h</small>' + (swap ? '<small>runs ' + swap + '</small>' : '') + '</button>';
    }
    h += '</div></div>';
    cur = new Date(y, m+1, 1);
  }
  return h + '</div>';
}

function leaveView(){
  const plan = S.leavePlan.slice().sort();
  const days = judgeDays(plan);
  const set = planSet(plan);
  const nCls = set.size;
  let focus = '';
  if(planFocus && days[planFocus] && days[planFocus].k === 'teach'){
    const o = days[planFocus];
    focus = '<p class="lfocus"><b>' + esc(prettyDate(planFocus)) + '</b> &middot; ' + esc(o.list.map(s => s.code + ' ' + s.comp + ' ' + hhmm(s.start) + ' ' + h1(s.hours) + 'h').join(', '))
      + '<br>' + (o.v.k === 'planned' ? 'In your plan. Click it again to take it out.' : 'Skipping this day too ' + esc(verdictText(o.v)) + '.') + '</p>';
  }
  let h = '<div class="split"><div>'
    + '<div class="card"><h2>Plan days off</h2><p class="tiny muted" style="margin:0">Click a class day to add it to the plan, again to take it out. Every other day re-judges itself against the plan as you go. Nothing is marked missed until you say so.</p>'
    + '<div class="lkey"><span class="k-ok"><i></i>affordable</span><span class="k-tight"><i></i>tight - under one class left somewhere</span>'
    + '<span class="k-no"><i></i>would put a course under its bar</span><span class="k-pl"><i></i>planned</span></div>' + focus + '</div>'
    + leaveCalendar(days) + '</div><aside class="rail">';

  // What the plan spends, course by course, next to what there is.
  if(!plan.length){
    h += '<div class="card">' + figureSlot('keys') + '<h2>Nothing planned</h2><p class="tiny muted" style="margin:0">Pick a day on the calendar, or take one of the breaks below. Each course\'s leave before and after the plan shows here.</p></div>';
  } else {
    h += '<div class="card"><h2>This plan &middot; ' + plan.length + ' day' + (plan.length===1?'':'s') + ', ' + nCls + ' class' + (nCls===1?'':'es') + '</h2>';
    S.courses.forEach(c => {
      const a = stats(c.code), b = stats(c.code, set);
      const spent = Math.max(0, a.budget - b.budget);
      const cls = b.budget < -1e-9 ? 'bad' : b.budget < b.step - 1e-9 ? 'warn' : '';
      const after = b.budget < -1e-9 ? hUp(-b.budget) + 'h under by term end' : b.budgetSessions + ' cls &middot; ' + hDown(b.budgetHours) + 'h';
      const keep = a.budgetHours > 0 ? Math.max(0, b.budgetHours) / a.budgetHours * 100 : 0;
      h += '<div class="lc"><b>' + esc(c.code) + '</b><span class="to ' + cls + '">' + a.budgetSessions + ' &rarr; ' + after + '</span>'
        + (a.budgetHours > 0 ? '<div class="lbar" role="img" aria-label="' + esc(c.code + ': ' + h1(spent) + ' of ' + hDown(a.budgetHours) + ' hours of leave spent by this plan') + '"><i style="width:'
          + keep.toFixed(1) + '%"></i><s style="left:' + keep.toFixed(1) + '%; width:' + Math.min(100 - keep, spent / a.budgetHours * 100).toFixed(1) + '%"></s></div>' : '')
        + '</div>';
    });
    const v = verdict(set, S.courses.map(c => c.code));
    if(v.k === 'no') h += '<div class="banner bad" style="margin:12px 0 0"><b>This plan does not fit</b>It ' + esc(verdictText(v)) + '. A mark changed since you planned, or a day was added from a stale view.</div>';
    h += '<div class="row" style="margin-top:14px"><button class="btn primary" id="pl-commit"' + (nCls ? '' : ' disabled') + '>Mark these ' + nCls + ' as skipping</button>'
      + '<button class="btn" id="pl-clear">Clear plan</button></div>'
      + '<p class="tiny muted" style="margin:10px 0 0">Marking sets each class to skipping, which every figure in the app already counts. Undo is one click.</p></div>';
  }

  const br = breaks(plan, days);
  h += '<div class="card"><h2>Breaks you can afford</h2>';
  if(!br.length) h += '<p class="tiny muted" style="margin:0">None fit on top of ' + (plan.length ? 'this plan' : 'your current leave') + '.</p>';
  else h += br.map(b => '<div class="brk"><div><b>' + esc(prettyDate(b.from)) + ' &ndash; ' + esc(prettyDate(b.to)) + '</b> &middot; ' + b.len + ' days off'
      + '<p>Skip ' + esc(b.skip.map(prettyDate).join(', ')) + ' &middot; ' + esc(costText(b.list)) + '</p></div>'
      + '<button class="btn small" data-break="' + b.skip.join(',') + '">Add</button></div>').join('');
  h += '<p class="tiny muted" style="margin:10px 0 0">Whole days, windows of up to ' + MAX_BREAK + ' days with at most ' + MAX_SKIP + ' skipped. One skipped class on its own is a mark on the Week grid.</p></div>';
  return h + '</aside></div>';
}

// --- Calendar editor -------------------------------------------------------
//
// The editor writes to the clipboard, never to storage. A calendar configured
// in one browser would leave every other copy of this app with an empty one -
// the calendar is part of the build, so it has to go back into the file.

let ED = null;
const CYCLE = ['teach','off','Mon','Tue','Wed','Thu','Fri','Sat'];

function edInit(){
  ED = { start: CALENDAR.start, end: CALENDAR.end, halfBoundary: CALENDAR.halfBoundary,
         off: new Set(CALENDAR.off||[]), swaps: Object.assign({}, CALENDAR.swaps||{}) };
}
function edState(d){ return ED.off.has(d) ? 'off' : (ED.swaps[d] || 'teach'); }
function edCycle(d){
  const cur = edState(d);
  const nxt = CYCLE[(CYCLE.indexOf(cur)+1) % CYCLE.length];
  ED.off.delete(d); delete ED.swaps[d];
  if(nxt === 'off') ED.off.add(d);
  else if(nxt !== 'teach') ED.swaps[d] = nxt;
}
function edConstant(){
  const off = Array.from(ED.off).sort();
  const sw = Object.keys(ED.swaps).sort();
  return 'const CALENDAR = {\n'
    + "  semester: '"+CALENDAR.semester+"', label: '"+CALENDAR.label+"',\n"
    + "  authored: '"+today()+"', provisional: false,\n"
    + "  source: '"+(CALENDAR.source||'')+"',\n"
    + "  start: '"+ED.start+"', end: '"+ED.end+"',\n"
    + "  halfBoundary: '"+ED.halfBoundary+"',\n"
    + '  off: ['+ off.map(d => "'"+d+"'").join(', ') +'],\n'
    + '  swaps: {'+ sw.map(d => "'"+d+"': '"+ED.swaps[d]+"'").join(', ') +'}\n'
    + '};';
}
function calendarView(){
  if(!ED) edInit();
  let h = '<div class="card"><h2>Semester calendar</h2>'
    + '<p class="tiny muted">Mon–Sat teach by default. Click a day to cycle it: teaching → no classes → runs Monday → Tuesday → … → teaching. When it looks right, copy the constant and paste it over the <code>CALENDAR</code> block at the top of this file\'s script. Nothing here is saved to your browser, on purpose.</p>'
    + '<div class="row"><label class="field">Term starts<input type="date" id="ed-start" value="'+ED.start+'"></label>'
    + '<label class="field">Term ends<input type="date" id="ed-end" value="'+ED.end+'"></label>'
    + '<label class="field">Second half begins<input type="date" id="ed-hb" value="'+ED.halfBoundary+'"></label>'
    + '<button class="btn" id="ed-reset">Reset to the build\'s calendar</button></div></div>';

  h += '<div class="months">';
  let cur = fromYmd(ED.start); cur.setDate(1);
  const last = fromYmd(ED.end);
  let guard = 0;
  while(cur <= last && guard++ < 24){
    const y = cur.getFullYear(), m = cur.getMonth();
    h += '<div class="month card"><h3>'+cur.toLocaleDateString(undefined,{month:'long', year:'numeric'})+'</h3><div class="mgrid">'
      + ['M','T','W','T','F','S','S'].map(d => '<div class="dow">'+d+'</div>').join('');
    const first = new Date(y,m,1), lead = (first.getDay()+6)%7;
    for(let i=0;i<lead;i++) h += '<button class="blank" disabled></button>';
    const dim = new Date(y,m+1,0).getDate();
    for(let dd=1; dd<=dim; dd++){
      const k = ymd(new Date(y,m,dd));
      const sun = new Date(y,m,dd).getDay() === 0;
      const outside = k < ED.start || k > ED.end;
      const st = edState(k);
      const cls = sun ? 'sun' : outside ? 'outside' : st === 'off' ? 'off' : st !== 'teach' ? 'swap' : '';
      h += '<button class="'+cls+'" '+((sun||outside)?'disabled':'data-ed="'+k+'"')+'>'+dd
        + (st !== 'teach' && st !== 'off' && !sun && !outside ? '<small>'+st+'</small>' : '') + '</button>';
    }
    h += '</div></div>';
    cur = new Date(y, m+1, 1);
  }
  h += '</div>';

  const gen = generatedCount();
  h += '<div class="card"><h2>What this calendar produces</h2>'
    + '<p class="tiny muted">Against the currently loaded timetable, the <b>build\'s</b> calendar generates <b>'+gen.n+'</b> sessions worth <b>'+h1(gen.hours)+'h</b>. The editor above does not affect this figure until you paste its output into the file.</p>'
    + '<button class="btn primary" id="ed-copy">Copy the constant</button> <span id="ed-msg" class="tiny"></span>'
    + '<pre class="out" id="ed-out">'+esc(edConstant())+'</pre></div>';
  return h;
}
// Non-cancelled sessions the count-from date is holding back, so both the
// banner and the control can state the cost in the currency that matters.
function excluded(){
  let n = 0, hours = 0, logged = 0;
  sessions().forEach(s => {
    if(s.counted || markOf(s) === 'cancelled') return;
    n++; hours += s.hours; if(S.log[s.id]) logged++;
  });
  return {n, hours, logged};
}
function generatedCount(){
  let n = 0, hours = 0;
  sessions().forEach(s => { if(markOf(s) !== 'cancelled'){ n++; hours += s.hours; } });
  return {n, hours};
}

// --- Data: import as a diff, backup, restore ------------------------------

function dataView(){
  let h = '<div class="card"><h2>Load a timetable from Bob</h2>'
    + '<p class="tiny muted">In Bob the Builder, click <b>Export for attendance</b>, then load that file here. Importing is a diff: you see exactly what changes and what logged sessions it costs before anything is written.</p>'
    + '<input type="file" id="imp-file" accept="application/json,.json"> <div id="imp-msg"></div><div id="imp-diff"></div></div>';
  if(localStorage.getItem(UNDO_KEY))
    h += '<div class="card"><h2>Undo the last import</h2><p class="tiny muted">One step deep. Restores the profile exactly as it was before the most recent import.</p><button class="btn" id="undo-btn">Undo the last import</button></div>';
  h += '<div class="card"><h2>Backup and restore</h2>'
    + '<p class="tiny muted">The backup is the whole profile - courses, every logged session, extras, bars and reconcile figures. Restoring replaces what is here.</p>'
    + '<div class="row"><button class="btn" id="bk-btn">Download a backup</button>'
    + '<input type="file" id="rs-file" accept="application/json,.json"></div><div id="bk-msg"></div></div>';
  const arch = Object.keys(localStorage).filter(k => k.indexOf(ARCHIVE_PRE) === 0);
  const rescued = Object.keys(localStorage).filter(k => k.indexOf(RESCUE_PRE) === 0).sort();
  if(rescued.length) h += '<div class="card"><h2>Profiles that could not be read</h2><p class="tiny muted">Set aside verbatim when they failed to load, before anything could overwrite them. Download one to repair it by hand, then restore it above.</p>'
    + rescued.map(k => '<div class="row"><code>'+esc(k)+'</code><span class="tiny muted">'+esc(new Date(+k.slice(RESCUE_PRE.length)).toLocaleString())+'</span><button class="btn small" data-rescue="'+esc(k)+'">Download</button></div>').join('') + '</div>';
  if(arch.length) h += '<div class="card"><h2>Archived semesters</h2><p class="tiny muted">Kept, never mixed into the current term. There is no browser for them - download one as a backup file if you need it.</p>'
    + arch.map(k => '<div class="row"><code>'+esc(k)+'</code><button class="btn small" data-arch="'+esc(k)+'">Download</button></div>').join('') + '</div>';
  h += '<div class="card"><h2>Start over</h2><p class="tiny muted">Clears the whole profile from this browser. Take a backup first - this is not undoable.</p>'
    + '<button class="btn" id="wipe-btn">Clear everything</button> <span id="wipe-msg" class="tiny"></span></div>';
  return h;
}

function settingsView(){
  return dataView()
    + '<details class="disclose"' + (calOpen ? ' open' : '') + ' id="cal-details"><summary>Semester calendar editor &middot; once a term</summary><div class="body">'
    + calendarView() + '</div></details>';
}
let calOpen = false;

function readJSON(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('unreadable'));
    r.onload = () => { try{ res(JSON.parse(r.result)); }catch(e){ rej(new Error('not JSON')); } };
    r.readAsText(file);
  });
}
function msg(sel, text, kind){ const el = $(sel); if(el) el.innerHTML = '<div class="msg '+(kind==='err'?'err':'ok')+'" role="status">'+esc(text)+'</div>'; }

let PENDING = null;

// The diff. Nothing is written by this function - it only describes what an
// apply would do, in the currency that matters: logged sessions at risk.
function diffAgainst(payload){
  const oldByCode = {}; S.courses.forEach(c => oldByCode[c.code] = c);
  const newByCode = {}; (payload.courses||[]).forEach(c => newByCode[c.code] = c);
  const logCount = code => sessions().filter(s => s.code === code && S.log[s.id]).length;
  const added = Object.keys(newByCode).filter(k => !oldByCode[k]);
  const removed = Object.keys(oldByCode).filter(k => !newByCode[k]).map(k => ({code:k, logged: logCount(k)}));
  const changed = [];
  Object.keys(newByCode).forEach(k => {
    if(!oldByCode[k]) return;
    const a = oldByCode[k].sections||{}, b = newByCode[k].sections||{};
    const comps = Array.from(new Set(Object.keys(a).concat(Object.keys(b))));
    const moved = comps.filter(c => a[c] !== b[c]);
    if(!moved.length) return;
    const lost = sessions().filter(s => s.code === k && S.log[s.id] && moved.indexOf(s.comp) >= 0).length;
    changed.push({code:k, moved: moved.map(c => c+' '+(a[c]||'none')+' → '+(b[c]||'none')), lost});
  });
  return {added, removed, changed, kept: Object.keys(newByCode).length - added.length};
}

function showDiff(payload){
  PENDING = payload;
  const d = diffAgainst(payload);
  const semMismatch = payload.semester && payload.semester !== CALENDAR.semester;
  const displacing = S.semester && payload.semester && S.semester !== payload.semester;
  let h = '<div class="card"><h3>Before anything is written</h3>';
  h += '<p class="tiny muted">From '+esc(payload.app||'?')+', plan '+esc(payload.planName||'unnamed')+', exported '+esc((payload.exportedAt||'').slice(0,10))+'.</p>';
  if(semMismatch) h += '<div class="banner bad"><b>Different semester</b>This file is for '+esc(payload.semester)+'; this build\'s calendar is '+CALENDAR.semester+'. No sessions will generate until the calendar matches.</div>';
  if(displacing) h += '<div class="banner warn"><b>Your current profile will be archived</b>It is for '+esc(S.semester)+'. It is copied to <code>'+ARCHIVE_PRE+esc(S.semester)+'</code> and never mixed with the new one.</div>';
  if(payload.skipped && payload.skipped.length) h += '<div class="banner warn"><b>'+payload.skipped.length+' course(s) were dropped by Bob before export</b>'+esc(payload.skipped.join(', '))+' - Bob\'s catalog no longer knows those codes.</div>';
  h += '<table><tbody>';
  h += '<tr><td>Unchanged</td><td>'+d.kept+' course(s)</td></tr>';
  h += '<tr><td>Added</td><td>'+(d.added.length? esc(d.added.join(', ')) : 'none')+'</td></tr>';
  h += '<tr><td>Removed</td><td>'+(d.removed.length ? d.removed.map(r => esc(r.code)+' <b>('+r.logged+' logged session'+(r.logged===1?'':'s')+' lost)</b>').join(', ') : 'none')+'</td></tr>';
  h += '<tr><td>Section changed</td><td>'+(d.changed.length ? d.changed.map(c => esc(c.code)+' '+esc(c.moved.join(', '))+' <b>('+c.lost+' logged session'+(c.lost===1?'':'s')+' no longer match)</b>').join('<br>') : 'none')+'</td></tr>';
  h += '</tbody></table>';
  const risk = d.removed.reduce((a,r)=>a+r.logged,0) + d.changed.reduce((a,c)=>a+c.lost,0);
  h += '<p class="'+(risk?'est':'muted')+'" style="margin-top:8px">'
    + (risk ? risk+' logged session'+(risk===1?'':'s')+' would stop counting. The previous profile is kept under one undo.'
            : 'No logged session is affected.')+'</p>';
  h += '<button class="btn primary" id="imp-ok">Apply this import</button> <button class="btn" id="imp-cancel">Cancel</button></div>';
  $('#imp-diff').innerHTML = h;
}

function applyImport(){
  const p = PENDING; if(!p) return;
  try{ localStorage.setItem(UNDO_KEY, JSON.stringify(S)); }catch(e){}
  if(S.semester && p.semester && S.semester !== p.semester){
    try{ localStorage.setItem(ARCHIVE_PRE + S.semester, JSON.stringify(S)); }catch(e){}
  }
  const fresh = S.semester && p.semester && S.semester !== p.semester;
  if(fresh){ const keepTheme = S.theme; S = blank(); S.theme = keepTheme; }
  S.semester = p.semester || null;
  S.planName = p.planName || '';
  S.exportedAt = p.exportedAt || null;
  S.importedAt = new Date().toISOString();
  S.courses = (p.courses||[]).map(c => ({ code:c.code, title:c.title, credits:c.credits,
                                          sections:c.sections||{}, meetings:c.meetings||[] }));
  // Logs are never pruned to match the new timetable. A session whose id no
  // longer generates simply stops counting; if the section moves back, it
  // counts again. Deleting it here is the silent data loss A2 is about.
  save(); invalidate(); PENDING = null;
  view = 'overview'; render();
  toast('Imported ' + S.courses.length + ' courses. Undo is available under Settings.');
}

function download(obj, name){
  const b = new Blob([typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

// --- Week grid popover -----------------------------------------------------
//
// A class on the grid opens three explicit choices beside it rather than
// stepping through them on each click. It sits outside #view and closes on a
// choice, Escape, a click elsewhere or a scroll.
let popFor = null;
function openPop(btn, id){
  const s = sessions().find(x => x.id === id); if(!s) return;
  const el = $('#pop');
  el.innerHTML = '<b>' + esc(s.code + ' ' + s.comp + ' ' + s.sec) + '</b><p>' + esc(prettyDate(s.date) + ', ' + hhmm(s.start) + '–' + hhmm(s.end)
    + ' · ' + h1(s.hours) + 'h' + (s.room ? ' · ' + s.room : '')) + '</p>' + markSeg(s);
  el.hidden = false; popFor = id;
  const r = btn.getBoundingClientRect(), w = el.offsetWidth, ht = el.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  const top = (r.bottom + 6 + ht < innerHeight) ? r.bottom + 6 : Math.max(8, r.top - ht - 6);
  el.style.left = left + 'px'; el.style.top = top + 'px';
  const on = el.querySelector('[aria-checked="true"]'); if(on) on.focus({preventScroll:true});
}
function closePop(){ const el = $('#pop'); if(el && !el.hidden){ el.hidden = true; el.innerHTML = ''; } popFor = null; }
addEventListener('keydown', e => { if(e.key === 'Escape') closePop(); });
addEventListener('scroll', closePop, {passive:true});

// --- Hairline figures --------------------------------------------------------
//
// Mounted after each render into any [data-figure] slot the view wrote, and
// destroyed before the next, because #view is replaced wholesale. The kernel
// and the figures live in their own scripts below; without them a slot stays
// an empty box rather than breaking the page.
const FIGURES = {};
let mounted = [];
function figureSlot(name){ return '<div class="figure" data-figure="' + name + '"></div>'; }
function mountFigures(){
  if(!window.HL) return;
  document.querySelectorAll('[data-figure]').forEach(slot => {
    const f = FIGURES[slot.dataset.figure]; if(!f) return;
    HL.inject(document);
    slot.setAttribute('data-hairline', f.name);
    slot.setAttribute('role', 'img');
    slot.setAttribute('aria-label', f.means);
    const svg = HL.mk('svg', { viewBox: '0 0 400 320', 'aria-hidden': 'true' }, slot);
    // The read-out names what is under the pointer. Rule 10 keeps it out of
    // the drawing; here it is spoken, not shown - a corner label on an empty
    // state would be a second caption competing with the heading under it.
    const read = { textContent: 'rest' };
    mounted.push(f.mount({ stage: slot, svg, read }, f.range[1]));
  });
}
function unmountFigures(){ mounted.forEach(m => { try{ m.destroy(); }catch(e){} }); mounted = []; }
window.hairline = f => { FIGURES[f.name] = f; if(document.querySelector('[data-figure="' + f.name + '"]')) render(); };

// --- Events ----------------------------------------------------------------

function timeToMin(v){ const p = String(v).split(':'); return (+p[0])*60 + (+p[1]); }

document.addEventListener('click', function(e){
  const pop = $('#pop');
  if(popFor && !pop.contains(e.target) && !e.target.closest('.blk')) closePop();
  const t = e.target.closest('[data-tab],[data-go],[data-sid],[data-week],[data-ed],[data-rmex],[data-arch],[data-rescue],[data-plan],[data-break],[data-dayall],button,[data-course],[data-pal]');
  if(!t) return;
  const d = t.dataset;

  if(d.tab){ view = d.tab; render(); return; }
  if(d.go){ view = d.go; render(); return; }
  if(d.pal){ S.theme = d.pal; save(); applyPalette(d.pal); paintPicker(); return; }
  if(d.sid){ if(popFor === d.sid) closePop(); else openPop(t, d.sid); return; }
  if(d.mark){
    const s0 = sessions().find(x => x.id === d.mark);
    const word = s0 && !isOver(s0) ? {attended:'going', absent:'skipping', cancelled:'cancelled'}[d.to] : MARK_WORD[d.to];
    if(setMark(d.mark, d.to, 'Marked ' + (s0 ? sessionName(s0) : 'class') + ' ' + word)) render();
    return;
  }
  if(d.dayall){
    const ids = uncheckedSessions().filter(s => s.date === d.dayall && markOf(s) !== 'cancelled').map(s => s.id);
    const before = writeMarks(ids, 'attended');
    if(Object.keys(before).length){ save(); remember('Marked ' + prettyDate(d.dayall) + ' all attended', before); }
    render(); return;
  }
  if(d.plan){
    const i = S.leavePlan.indexOf(d.plan);
    if(i >= 0) S.leavePlan.splice(i, 1); else S.leavePlan.push(d.plan);
    planFocus = d.plan; save(); render(); return;
  }
  if(d.break){
    d.break.split(',').forEach(x => { if(S.leavePlan.indexOf(x) < 0) S.leavePlan.push(x); });
    planFocus = null; save(); render(); return;
  }
  // A course row. The summary line toggles; the panel it opens holds controls
  // of its own, so the whole article no longer carries the toggle.
  if(d.course !== undefined){
    openCourse = (openCourse === d.course) ? null : d.course;
    refocus = d.course; render(); return;
  }
  if(d.week !== undefined){
    const mon = S.week || weekMonday(today());
    S.week = d.week === '0' ? weekMonday(today()) : addDays(mon, d.week === '1' ? 7 : -7);
    save(); render(); return;
  }
  if(d.rmex !== undefined){ S.extras.splice(+d.rmex, 1); save(); render(); return; }
  if(d.ed){ edCycle(d.ed); render(); return; }
  if(d.arch){ try{ download(JSON.parse(localStorage.getItem(d.arch)), d.arch+'.json'); }catch(err){ msg('#bk-msg','That archive could not be read.','err'); } return; }
  if(d.rescue){ download(localStorage.getItem(d.rescue) || '', d.rescue + '.txt'); return; }

  switch(t.id){
    case 'undo-mark': undo(); return;
    case 'pt-ok': applyPortal(); return;
    case 'pt-clear': $('#pt-text').value = ''; portalShow(); return;
    case 'su-check': view = 'log'; render(); return;
    case 'su-today': {
      const was = {countFrom: S.countFrom, reviewedThrough: S.reviewedThrough};
      const t0 = today();
      S.countFrom = (t0 > CALENDAR.start && t0 <= CALENDAR.end) ? t0 : S.countFrom;
      S.reviewedThrough = lastDay();
      save(); remember('Counting from ' + prettyDate(t0), {}, was); render(); return;
    }
    case 'su-all': {
      const was = {reviewedThrough: S.reviewedThrough};
      S.reviewedThrough = lastDay();
      save(); remember('Marked everything before today as checked', {}, was); render(); return;
    }
    case 'ck-save': {
      // Today counts as checked only once its last class is over; otherwise
      // the check-in stops at yesterday and today's later classes stay due.
      let thr = t.dataset.through;
      if(thr >= today() && sessions().some(s => s.date === today() && s.counted && !isOver(s))) thr = lastDay();
      const was = {reviewedThrough: S.reviewedThrough};
      S.reviewedThrough = thr;
      save(); remember('Checked up to ' + prettyDate(thr), {}, was); render(); return;
    }
    case 'pl-commit': {
      const ids = Array.from(planSet(S.leavePlan));
      const was = {leavePlan: S.leavePlan.slice()};
      const before = writeMarks(ids, 'absent');
      S.leavePlan = []; planFocus = null;
      save(); remember('Marked ' + ids.length + ' planned class' + (ids.length===1?'':'es') + ' as skipping', before, was); render(); return;
    }
    case 'pl-clear': {
      const was = {leavePlan: S.leavePlan.slice()};
      S.leavePlan = []; planFocus = null;
      save(); remember('Cleared the leave plan', {}, was); render(); return;
    }
    case 'ex-add': {
      const code = $('#ex-code').value, date = $('#ex-date').value;
      const st = timeToMin($('#ex-start').value), en = timeToMin($('#ex-end').value);
      if(!code || !date || !($('#ex-start').value) || !($('#ex-end').value)) return msg('#ex-msg','Fill in the course, the date and both times.','err');
      if(!(en > st)) return msg('#ex-msg','The end time has to be after the start time.','err');
      if(date < CALENDAR.start || date > CALENDAR.end) return msg('#ex-msg','That date is outside the semester ('+CALENDAR.start+' to '+CALENDAR.end+'), so it would never appear.','err');
      S.extras.push({code, date, start:st, end:en});
      save(); render(); toast('Added a '+h1(contactHours(st,en))+'h extra class for '+code+'.');
      return;
    }
    case 'cf-reset': S.countFrom = null; save(); render(); toast('Counting the whole term again.'); return;
    case 'ed-reset': edInit(); render(); return;
    case 'ed-copy': {
      const txt = edConstant();
      const done = () => { const m = $('#ed-msg'); if(m) m.textContent = 'Copied. Paste it over the CALENDAR block in this file.'; };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, selectOut);
      else selectOut();
      return;
    }
    case 'imp-ok': applyImport(); return;
    case 'imp-cancel': PENDING = null; $('#imp-diff').innerHTML = ''; msg('#imp-msg','Cancelled. Nothing was written.'); return;
    case 'undo-btn': {
      const raw = localStorage.getItem(UNDO_KEY);
      if(!raw) return;
      try{ S = migrate(JSON.parse(raw)); }catch(err){ return msg('#bk-msg','The undo snapshot could not be read.','err'); }
      localStorage.removeItem(UNDO_KEY); save(); render(); toast('Restored the profile from before the last import.');
      return;
    }
    case 'bk-btn': download({kind:'atten-backup', v:SCHEMA_VERSION, savedAt:new Date().toISOString(), profile:S},
                            'attendance-backup-'+today()+'.json'); return;
    case 'wipe-btn': {
      if(t.dataset.armed){ localStorage.removeItem(STORE_KEY); S = blank(); save(); render(); toast('Cleared.'); return; }
      t.dataset.armed = '1'; t.textContent = 'Click again to clear everything';
      $('#wipe-msg').textContent = 'This removes every logged session. Cancel by leaving this tab.';
      return;
    }
  }
});
function selectOut(){
  const pre = $('#ed-out'); if(!pre) return;
  const r = document.createRange(); r.selectNodeContents(pre);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  const m = $('#ed-msg'); if(m) m.textContent = 'Selected - press Ctrl+C to copy.';
}

document.addEventListener('input', function(e){ if(e.target.id === 'pt-text') portalShow(); });

document.addEventListener('change', function(e){
  const d = e.target.dataset;
  if(d.thr){
    const v = Number(e.target.value);
    if(!(v > 0 && v <= 100)) return;
    S.thresholds[d.thr] = v/100; save(); render(); return;
  }
  if(d.off !== undefined && d.off){
    // Kept as typed, so 27/32 stays a count; parseOfficial() reads it.
    const v = e.target.value.trim();
    if(v === '') delete S.official[d.off]; else S.official[d.off] = v;
    save(); render(); return;
  }
  if(e.target.id === 'lg-course'){ logCourse = e.target.value; render(); return; }
  if(e.target.id === 'cf-date'){
    const v = e.target.value;
    if(!v) return msg('#cf-msg','Pick a date, or use the button to count the whole term.','err');
    if(v < CALENDAR.start || v > CALENDAR.end)
      return msg('#cf-msg','That date is outside the semester (' + CALENDAR.start + ' to ' + CALENDAR.end + ').','err');
    S.countFrom = (v === CALENDAR.start) ? null : v;
    save(); render(); return;
  }
  if(e.target.id === 'ed-start'){ ED.start = e.target.value; render(); return; }
  if(e.target.id === 'ed-end'){ ED.end = e.target.value; render(); return; }
  if(e.target.id === 'ed-hb'){ ED.halfBoundary = e.target.value; render(); return; }
  if(e.target.id === 'imp-file'){
    const f = e.target.files[0]; if(!f) return;
    readJSON(f).then(data => {
      if(!data || data.kind !== 'bob-attendance')
        return msg('#imp-msg','That file is not a Bob attendance export. It says kind "'+(data && data.kind ? data.kind : 'nothing')+'"; this app needs "bob-attendance". A plain bob-plan export will not do - it carries no meeting times.','err');
      if(!Array.isArray(data.courses)) return msg('#imp-msg','That export has no courses array in it.','err');
      msg('#imp-msg','Read '+data.courses.length+' course(s). Nothing has been written yet.');
      showDiff(data);
    }, err => msg('#imp-msg','Could not read that file: '+err.message+'.','err'));
    return;
  }
  if(e.target.id === 'rs-file'){
    const f = e.target.files[0]; if(!f) return;
    readJSON(f).then(data => {
      const prof = data && data.kind === 'atten-backup' ? data.profile : data;
      if(!prof || !Array.isArray(prof.courses)) return msg('#bk-msg','That is not an attendance backup.','err');
      try{ localStorage.setItem(UNDO_KEY, JSON.stringify(S)); }catch(err){}
      S = migrate(prof); save(); render();
      toast('Restored '+S.courses.length+' courses and '+Object.keys(S.log).length+' logged sessions.');
    }, err => msg('#bk-msg','Could not read that file: '+err.message+'.','err'));
  }
});

// --- Boot ------------------------------------------------------------------

// "in 40 minutes" is a claim that decays. Re-render the Courses tab once a
// minute so it can never sit there being wrong by an hour.
// The Log and Leave tabs depend on the clock too - a class ending moves it
// from planning to logging - but re-rendering a form under someone mid-edit is
// worse than a minute's staleness, so only the Overview ticks.
setInterval(() => { if(view === 'overview' && S.courses.length) render(); }, 60000);

load();
applyPalette(activePalette());
render();

if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0)
  navigator.serviceWorker.register('sw.js').catch(function(){});

// Exposed for the verification harness, not for the page. Everything the UI
// does goes through a real click; these are read-only handles onto the maths.
window.Atten = { portalParse, portalPlan, CALENDAR, PALETTES, sessions, stats, stateLine, contactHours, diffAgainst, countFrom, excluded, nextSession, whenLabel,
                 judgeDays, breaks, planSet, verdict, parseOfficial, uncheckedCount,
                 state: () => S, render, save, blank };
})();
</script>

<script id="hl-kernel">

 * the default camera, Cam(45, 0.5, S), +x runs down to the right and +y down
 * to the left, so the corner with the largest x and y is nearest the viewer:
 * append by ascending x + y, from the far corner (smallest x and y) to it.
 *
 * Camera
 *   Cam(azDeg, k, S)                       a camera: azimuth in degrees, k = sin(elevation) (0.5 is the 2:1 view), S = scale

 *                                          it only centres, it never scales: choose S by trying values, with the most extreme pose in points.
 *                                          The six figures use S 1.42 to 2.12; the boxes they fit come out 230 to 310 wide and 180 to 245 tall
 *   proj(C)                                returns P(x, y, z), which gives [sx, sy]
 *   unproj(C, sx, sy, z)                   the world [x, y] under a screen point, on the plane at height z
 *   facing(C)                              returns front(sample): whether a ring sample faces the camera

 *   rrect(u0, v0, u1, v1, r, n)            a rounded rectangle, as a ring of samples {u, v, nu, nv}

 *                                          r, the corner radius, is cut to half the shorter side. b, the crease's inset in world units
 *                                          (0.6 to 2.2 in the figures), must stay under half the shorter side or the crease turns inside out
 *   prism(P, front, ring, inner, z0, z1)   {sil, crease}: a solid standing from z0 to z1, as two path strings
 *   ringAt(P, ring, z)                     the ring's points, projected at height z

<script id="hl-keys">(() => {
/**
 * Keys: a board on the wall with a rail of seven hooks, a key on every one -
 * none taken. The pointer tips the key under it out from the board, and its
 * neighbours swing less the further they hang, each on its own spring. At rest
 * one key hangs a little askew and carries the bright edge. The slider is the
 * reach, in keys.
 *
 * The pattern: a field over one row of parts. Picking is by each key's rest
 * centre on screen x, which never moves, so a key swinging out from under the
 * pointer cannot change the choice.
 */

  Cam, circ, clamp, facing, fillet, fit, poly, prism, proj, rings, seg, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

// the rack reads as a set of real ones rather than a pattern.

const REST = [0, 3, 0, 9, 0, 2, 0];              // degrees out from the board; one hangs askew

  name: "keys",
  means: "A rack of keys with none taken: the key under the pointer tips out from the board, its neighbours less.",
  rules: [1, 3, 5, 9],
  range: [1, 2, 3.5],
  mount,
});

})();</script>
